<title>Rearme das Salas · Farmasi Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
/* Mesmo visual do calendário da arena e do checklist pré-show: barra vermelho-escura,
   Onest, títulos em maiúsculas, cartões brancos arredondados e botões em pílula */
:root{
  --paper:#f6f5f3; --card:#ffffff; --ink:#0a0a0a; --muted:#717784; --line:#e6e8ec; --ghost:#d7dae1;
  --band:#a10f12; --band-ink:#ffffff; --brand:#e11518; --brand-deep:#a10f12; --brand-light:#ed7374;
  --ok:#15803d; --ok-bg:#e4f4ea; --no:#e11518; --no-bg:#fdecec; --warn:#b45309; --warn-bg:#fdf0da;
  --chip:#eeece9; --focus:#ed7374;
  --r-card:24px; --r-pill:999px; --r-field:12px;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--band);color:var(--band-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:64px;padding-block:10px}
.mark{width:44px;height:44px;flex:none;display:block;border-radius:8px}
.brand-t{font-size:16px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;line-height:1.1;white-space:nowrap}
.brand-s{display:inline-block;margin-top:3px;font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7)}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{background:transparent;border:0;color:rgba(255,255,255,.6);padding:8px 14px;border-radius:var(--r-pill);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab[aria-current="page"]{color:#fff;background:rgba(255,255,255,.15)}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap > .row > .fld{flex-basis:180px}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance;text-transform:uppercase}
h1{font-size:30px;line-height:1;letter-spacing:-.025em;overflow-wrap:anywhere}
h2{font-size:12px;letter-spacing:.22em;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:6px;border-radius:var(--r-pill);background:var(--brand);flex:none}
h3{font-size:14px;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.pad{padding:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.fld{display:flex;flex-direction:column;gap:8px;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex:1 1 180px;min-width:0}
input[type=text],input[type=date],input[type=password],textarea,select{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-field);padding:11px 14px;font-size:15px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--brand-light);outline:none}
textarea{resize:vertical;min-height:70px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:0 18px;font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--no)}
.btn.danger:hover{background:var(--no);color:#fff;border-color:var(--no)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:none;padding:4px 0;color:var(--muted);font-weight:500;font-size:13px}
.link:hover{color:var(--ink)}

.chip{display:inline-block;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:var(--r-pill);background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.no{background:var(--no-bg);color:var(--no)}
.chip b{color:var(--ink);font-weight:600}

/* lista de rearmes */
.lst{display:flex;flex-direction:column}
.lst-i{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:18px 20px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.lst-i:first-child{border-top:0}
.lst-i:hover{background:var(--paper)}
.lst-t{font-weight:500;font-size:18px;text-transform:uppercase;overflow-wrap:anywhere}
.lst-m{font-size:13px;color:var(--muted)}
.lst-p{grid-row:1 / span 2;grid-column:2;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:var(--r-pill);overflow:hidden;display:flex;grid-column:1 / -1}
.bar i{display:block;height:100%}
.b-ok{background:var(--ok)} .b-no{background:var(--no)}

/* salas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sala{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ghost);border-radius:var(--r-field);padding:14px 16px;width:100%}
.sala:hover{border-color:var(--ink)}
.sala.st-ok,.sala.st-rearmada{border-left-color:var(--ok)}
.sala.st-divergente{border-left-color:var(--no);background:#fffafa}
.sala-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sala-t{font-weight:500;font-size:16px}
.sala-c{font-size:12px;color:var(--muted)}
.difs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.falta{color:var(--no);font-weight:500}
.sobra{color:var(--warn);font-weight:500}

/* conferência */
.itens{display:flex;flex-direction:column;border-radius:var(--r-card);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);border-left:4px solid transparent}
.it:first-child{border-top:0}
.it.d-falta{border-left-color:var(--no);background:var(--no-bg)}
.it.d-sobra{border-left-color:var(--warn);background:var(--warn-bg)}
.it-n{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.it-n b{font-weight:500;overflow-wrap:anywhere}
.it-n span{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:44px;height:44px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.step button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.step output{min-width:32px;text-align:center;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);font-size:22px;width:32px;height:32px;flex:none}
.x:hover{color:var(--no)}

/* lista de rearme */
.blk{display:flex;flex-direction:column;gap:8px}
.blk ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.blk li{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-field);padding:10px 14px;font-size:15px}
.blk li.feito{opacity:.5;text-decoration:line-through}
.bloco{border:1px solid var(--line);border-radius:var(--r-field);padding:14px;gap:10px}
.blk h4{margin:6px 0 0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cruz li{display:flex;flex-direction:column;gap:2px}
.cruz li .dl{font-size:14px}
.blk .vazio{font-size:14px;color:var(--muted);margin:0}
.notice{border:1px solid rgba(180,83,9,.3);background:var(--warn-bg);padding:12px 16px;border-radius:var(--r-field);font-size:14px}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.copybox textarea{min-height:200px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-size:13px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}
.ro-tag{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.75)}

/* ---- visual: painel, abas, blocos, cartões de movimento ---- */
.btn.big{min-height:54px;font-size:13px;width:100%;border-radius:16px}
.btn.sm{min-height:34px;padding:0 12px;font-size:11px}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ok:hover{background:#0f6a32;border-color:#0f6a32}
.big-ic{font-size:40px;margin-bottom:8px}

.ring{--a:0%;--b:0%;position:relative;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--ok) 0 var(--a),var(--no) 0 var(--b),var(--chip) 0)}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ring span b{font-size:18px;color:var(--ink);font-weight:600}
.ring.g{width:96px;height:96px}
.ring.g::before{inset:10px}
.ring.g span b{font-size:28px}

.lst-i{grid-template-columns:auto 1fr auto;gap:16px}
.lst-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.lst-go{font-size:28px;color:var(--ghost)}

.resumo{display:flex;align-items:center;gap:18px}
.tiles{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-width:0}
.tile{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;transition:border-color .2s,box-shadow .2s}
.tile b{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:10.5px;font-weight:500;letter-spacing:.04em;line-height:1.25;text-transform:uppercase;color:var(--muted)}
.tile:hover{border-color:var(--ink)}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.t-no b{color:var(--no)} .t-ok b{color:var(--ok)} .t-rea b{color:var(--ok)}
.t-pend b{color:var(--ink)}

.acoes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.acao{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 6px;min-height:78px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;text-align:center;transition:background .2s,color .2s,border-color .2s}
.acao .ic{font-size:22px;line-height:1}
.acao:hover{border-color:var(--ink)}
.acao.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.acao.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.acao[disabled]{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok);pointer-events:none}

.seg{display:flex;gap:4px;background:var(--chip);border-radius:var(--r-pill);padding:4px}
.seg button{flex:1 1 auto;min-width:0;border:0;background:none;border-radius:var(--r-pill);min-height:42px;padding:0 8px;font-size:11.5px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg .n{background:var(--brand);color:#fff;border-radius:var(--r-pill);font-size:10px;padding:1px 7px;letter-spacing:0}

.bl{display:flex;flex-direction:column;gap:12px}
.bl-h{display:flex;align-items:center;gap:12px}
.bl-ic{width:42px;height:42px;flex:none;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:20px}
.bl-t{display:flex;flex-direction:column;gap:1px}
.bl-t b{font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.bl-t span{font-size:12.5px;color:var(--muted)}
.mini{width:70px;height:6px;border-radius:var(--r-pill);background:var(--chip);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--ok)}
.cnt{min-width:34px;height:34px;padding:0 10px;border-radius:var(--r-pill);background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.tot{display:flex;gap:6px}
.bl h4{margin:4px 0 0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vazio{font-size:14px;color:var(--muted);margin:0}

.sala{gap:10px;border-left:1px solid var(--line);border-radius:16px;padding:14px}
.sala-h{align-items:center;gap:10px}
.sala-t{display:block;font-size:20px;font-weight:600;line-height:1.1}
.sala-c{display:block;margin-top:2px}
.st-ic{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;border:2px dashed var(--ghost)}
.st-ok .st-ic{border:0;background:var(--ok-bg);color:var(--ok)}
.st-rearmada .st-ic{border:0;background:var(--ok);color:#fff}
.st-divergente .st-ic{border:0;background:var(--no);color:#fff}
.st-rot{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.st-ok .st-rot,.st-rearmada .st-rot{color:var(--ok)}
.st-divergente .st-rot{color:var(--no)}
.sala.st-rearmada{background:#f7fcf8}
.dcs{display:flex;flex-wrap:wrap;gap:6px}
.dc{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:var(--r-pill);white-space:nowrap}
.dc.f{background:var(--no-bg);color:var(--no)}
.dc.s{background:var(--warn-bg);color:var(--warn)}
.dc.n{background:var(--paper);border:1px solid var(--line);color:var(--ink);font-weight:400}
.dc.n b{font-weight:600}
.sala-cat{display:flex;flex-direction:column;gap:12px;padding:16px}

.cz{display:flex;flex-direction:column;gap:8px}
.cz-l{display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
.cz-top{display:flex;align-items:center;gap:10px}
.cz-l.feito{opacity:.55}
.cod{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;font-weight:600;font-size:14px;flex:none}
.ok-tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ok);background:var(--ok-bg);border-radius:var(--r-pill);padding:4px 10px}

.movs{display:flex;flex-direction:column;gap:8px}
.mov{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.mov .sl{font-weight:600;font-size:14px;background:var(--chip);border-radius:10px;padding:7px 10px;white-space:nowrap}
.mov .sl.dep{background:var(--warn-bg);color:var(--warn)}
.mov .seta{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.mov .seta b{font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.mov .seta i{position:relative;display:block;width:100%;height:2px;background:var(--brand-light)}
.mov .seta i::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--brand-light);border-right:0}
.mov.feito{opacity:.45}
.mov.feito .seta b{text-decoration:line-through}
.obs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.obs li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}

.sala-top{display:flex;align-items:center;gap:12px}
.sala-top h1{line-height:1}
.pill{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.no{background:var(--no-bg);color:var(--no)}
.certo{color:var(--ok);font-weight:600}
.fixo{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;padding:14px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(246,245,243,0),var(--paper) 35%)}
.fixo .btn{flex:1 1 0;min-height:52px;border-radius:16px}
.fixo .btn.ink{flex-grow:1.5}
.btn.duo{flex-direction:column;gap:1px;line-height:1.2}
.btn.duo small{font-size:10px;letter-spacing:.04em;opacity:.7;text-transform:none}
.link{text-align:left}

@media (max-width:560px){
  .band-in{flex-wrap:wrap}
  .tabs{margin-left:0;width:100%}
  h1{font-size:24px}
  .resumo{gap:14px;padding:16px}
  .ring.g{width:84px;height:84px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .tile b{font-size:22px}
}
@media print{
  .band,.no-print,.toast{display:none!important}
  body{background:#fff}
  main{padding:0}
  .panel{border:0}
  .mov,.cz-l{break-inside:avoid}
}
</style>

<header class="band">
  <div class="band-in">
    <img class="mark" alt="GL events" width="44" height="44" src="logo_gl.png">
    <div class="grow">
      <div class="brand-t">Farmasi Arena</div>
      <div class="brand-s">Rearme das salas</div>
    </div>
    <nav class="tabs" id="tabs" hidden>
      <button class="tab" data-a="go-lista" id="tab-lista">Rearmes</button>
      <button class="tab" data-a="go-salas" id="tab-salas">Salas</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"><div class="panel empty">Carregando…</div></div></main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');

const S = {
  papel: null, pedirSenha: false, erro: '', carregou: false,
  catalogo: { tipos: {}, salas: [] }, rearmes: {},
  view: 'lista', rearmeId: null, salaId: null,
  rasc: null,        // conferência em andamento: { itens: [{tipoId, previsto, qtd}], conferidaPor, obs }
  ed: null,          // edição do previsto: { id, codigo, nome, grupo, itens: [{tipoId, qtd}], nova }
  novo: false, copia: null, confirmar: null,
  aba: 'salas',      // dentro do rearme: 'salas' | 'cruz' | 'lista'
  filtro: null       // filtro das salas: null | 'pendente' | 'divergente' | 'ok' | 'rearmada'
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const fmtData = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const fmtHora = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
const pode = min => ({ consulta: 1, equipe: 2, admin: 3 })[S.papel] >= ({ consulta: 1, equipe: 2, admin: 3 })[min];
let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 2800); }

// ---------- servidor ----------
async function api(metodo, url, corpo){
  const r = await fetch(url, { method: metodo, headers: corpo ? { 'content-type': 'application/json' } : {}, body: corpo ? JSON.stringify(corpo) : undefined, credentials: 'same-origin', cache: 'no-store' });
  if (r.status === 401 && url !== 'api/entrar') { S.pedirSenha = true; render(); throw { msg: 'Entre com a senha' }; }
  const d = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw { msg: (d && d.erro) || 'Sem conexão com o servidor', status: r.status };
  return d;
}
let gravando = 0, recarregarDepois = false;
async function recarregar(){
  if (gravando) { recarregarDepois = true; return; }
  const d = await api('GET', 'api/dados');
  S.catalogo = d.catalogo || { tipos: {}, salas: [] };
  S.rearmes = d.rearmes || {};
  S.papel = d.papel || null;
  S.carregou = true; S.pedirSenha = false;
  if (S.view !== 'lista' && S.view !== 'salas' && S.view !== 'salaEd' && !S.rearmes[S.rearmeId]) S.view = 'lista';
  // não redesenha enquanto alguém digita (a mudança aparece no próximo toque)
  const foco = document.activeElement;
  if (foco && app.contains(foco) && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return;
  render();
}
async function gravar(metodo, url, corpo){
  gravando++;
  try { return await api(metodo, url, corpo); }
  finally { gravando--; if (!gravando) { recarregarDepois = false; recarregar().catch(() => {}); } }
}
let aoVivo = false;
function ligarAoVivo(){
  if (aoVivo) return; aoVivo = true;
  try { const es = new EventSource('api/eventos'); es.onmessage = () => recarregar().catch(() => {}); } catch (_) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden) recarregar().catch(() => {}); });
  setInterval(() => { if (!document.hidden) recarregar().catch(() => {}); }, 60000);
}
// Link direto para um rearme (#r=<id>), para mandar ao outro setor já no evento certo
let linkPronto = false;
function abrirPeloLink(){
  linkPronto = true;
  const p = new URLSearchParams(location.hash.slice(1));
  const r = p.get('r');
  if (!r || !S.rearmes[r]) return;
  S.rearmeId = r; S.view = 'rearme';
  const s = p.get('s');
  if (s && salaPorId(s)) abrirSala(s); else render();
}
window.addEventListener('hashchange', () => { if (S.carregou) abrirPeloLink(); });
function marcarLink(){
  if (!linkPronto) return;
  const h = S.view === 'rearme' || S.view === 'sala' ? '#r=' + S.rearmeId : '';
  if (location.hash !== h) history.replaceState(null, '', h || location.pathname);
}
function iniciar(){
  recarregar().then(() => { ligarAoVivo(); abrirPeloLink(); }, e => { if (!S.pedirSenha) { S.erro = 'Não foi possível falar com o servidor. Verifique a internet e recarregue a página.'; render(); } });
}

// ---------- regras ----------
const nomeTipo = id => (S.catalogo.tipos[id] && S.catalogo.tipos[id].nome) || id;
const salaPorId = id => S.catalogo.salas.find(s => s.id === id);
const codigo = id => { const s = salaPorId(id); return s ? s.codigo : id; };
function previsto(sala){ const o = {}; (sala.itens || []).forEach(i => { o[i.tipoId] = (o[i.tipoId] || 0) + i.qtd; }); return o; }

function diferencas(prev, cont){
  const ids = [...Object.keys(prev || {})];
  Object.keys(cont || {}).forEach(id => { if (!ids.includes(id)) ids.push(id); });
  const out = [];
  ids.forEach(id => {
    const p = Number((prev || {})[id]) || 0;
    const c = cont && cont[id] !== undefined && cont[id] !== null ? Number(cont[id]) || 0 : p;
    if (c !== p) out.push({ tipoId: id, previsto: p, contado: c, dif: c - p });
  });
  return out;
}

// A sobra de uma sala cobre a falta de outra (mesmo item) antes de ir ao depósito.
// Primeiro dentro do mesmo bloco (camarim com camarim, produção com produção),
// depois entre blocos (mais longe) e só então o depósito.
//   prevPorSala: { salaId: { tipoId: qtd } }   contagens: [[salaId, { tipoId: qtd }], ...]
//   grupoDe: { salaId: 'Camarim' | 'Produção' | ... } (opcional)
function calcularPlano(prevPorSala, contagens, grupoDe){
  const gr = id => (grupoDe && grupoDe[id]) || '';
  const porTipo = {}, ordem = [], porSala = {};
  contagens.forEach(([salaId, cont]) => {
    diferencas(prevPorSala[salaId] || {}, cont || {}).forEach(d => {
      if (!porTipo[d.tipoId]) { porTipo[d.tipoId] = { faltas: [], sobras: [] }; ordem.push(d.tipoId); }
      if (!porSala[salaId]) porSala[salaId] = { faltas: [], sobras: [] };
      if (d.dif < 0) { porTipo[d.tipoId].faltas.push({ salaId, qtd: -d.dif }); porSala[salaId].faltas.push({ tipoId: d.tipoId, qtd: -d.dif }); }
      else { porTipo[d.tipoId].sobras.push({ salaId, qtd: d.dif }); porSala[salaId].sobras.push({ tipoId: d.tipoId, qtd: d.dif }); }
    });
  });
  const remanejar = [], buscar = [], devolver = [];
  const casar = (tipoId, sobras, faltas, mesmoBloco) => {
    sobras.forEach(s => faltas.forEach(f => {
      if (!s.qtd || !f.qtd) return;
      if (mesmoBloco && gr(s.salaId) !== gr(f.salaId)) return;
      const n = Math.min(s.qtd, f.qtd);
      remanejar.push({ tipoId, de: s.salaId, para: f.salaId, qtd: n, bloco: mesmoBloco ? gr(s.salaId) : null });
      s.qtd -= n; f.qtd -= n;
    }));
  };
  ordem.forEach(tipoId => {
    const faltas = porTipo[tipoId].faltas.map(x => ({ ...x })), sobras = porTipo[tipoId].sobras.map(x => ({ ...x }));
    casar(tipoId, sobras, faltas, true);
    casar(tipoId, sobras, faltas, false);
    faltas.forEach(f => { if (f.qtd > 0) buscar.push({ tipoId, para: f.salaId, qtd: f.qtd }); });
    sobras.forEach(s => { if (s.qtd > 0) devolver.push({ tipoId, de: s.salaId, qtd: s.qtd }); });
  });
  return { remanejar, buscar, devolver, porSala };
}
// Blocos na ordem em que aparecem nas salas: [{ grupo, nome, salas: [sala] }]
const NOME_BLOCO = { 'Camarim': 'Camarins', 'Produção': 'Salas de produção' };
function blocos(){
  const out = [], idx = {};
  S.catalogo.salas.forEach(s => {
    const g = s.grupo || '';
    if (!(g in idx)) { idx[g] = out.length; out.push({ grupo: g, nome: NOME_BLOCO[g] || g || 'Outras salas', salas: [] }); }
    out[idx[g]].salas.push(s);
  });
  return out;
}
const nomeBloco = g => NOME_BLOCO[g] || g || 'Outras salas';
window.calcularPlano = calcularPlano;

function statusSala(sala, reg){
  if (!reg || !reg.conferidaEm) return 'pendente';
  if (reg.rearmadaEm) return 'rearmada';
  return diferencas(previsto(sala), reg.contagem).length ? 'divergente' : 'ok';
}
function resumo(r){
  const c = { total: S.catalogo.salas.length, pendente: 0, ok: 0, divergente: 0, rearmada: 0 };
  S.catalogo.salas.forEach(s => { c[statusSala(s, (r.salas || {})[s.id])]++; });
  c.conferidas = c.total - c.pendente;
  return c;
}
function planoDe(r){
  const prev = {}, conts = [];
  S.catalogo.salas.forEach(s => {
    prev[s.id] = previsto(s);
    const reg = (r.salas || {})[s.id];
    if (reg && reg.conferidaEm) conts.push([s.id, reg.contagem || {}]);
  });
  const grupoDe = {}; S.catalogo.salas.forEach(s => { grupoDe[s.id] = s.grupo || ''; });
  return calcularPlano(prev, conts, grupoDe);
}
const plural = (n, um, varios) => n === 1 ? um : varios;

// ---------- telas ----------
function render(){
  lerCampos();
  document.getElementById('tabs').hidden = !S.carregou || S.pedirSenha;
  document.getElementById('tab-lista').setAttribute('aria-current', ['lista', 'rearme', 'sala'].includes(S.view) ? 'page' : 'false');
  document.getElementById('tab-salas').setAttribute('aria-current', ['salas', 'salaEd'].includes(S.view) ? 'page' : 'false');
  if (S.pedirSenha) { app.innerHTML = viewSenha(); return; }
  if (S.erro) { app.innerHTML = `<div class="panel empty">${esc(S.erro)}</div>`; return; }
  if (!S.carregou) { app.innerHTML = `<div class="panel empty">Carregando…</div>`; return; }
  const v = { lista: viewLista, rearme: viewRearme, sala: viewSala, salas: viewSalas, salaEd: viewSalaEd }[S.view] || viewLista;
  app.innerHTML = v();
  marcarLink();
}

function viewSenha(){
  return `<section class="panel pad" style="max-width:440px;margin:24px auto;display:flex;flex-direction:column;gap:12px">
    <h2>Entrar</h2>
    <p class="muted" style="margin:0">Digite a senha que você recebeu.</p>
    <form id="f-senha" class="row" style="align-items:flex-end">
      <label class="fld">Senha<input type="password" id="senha" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit">Entrar</button>
    </form>
  </section>`;
}

const ICONE_BLOCO = g => g === 'Camarim' ? '🎭' : g === 'Produção' ? '🎬' : '🚪';
const ROT_ST = { pendente: 'A conferir', divergente: 'Com diferença', ok: 'Tudo certo', rearmada: 'Rearmadas' };
const pecas = s => { const n = (s.itens || []).reduce((a, i) => a + i.qtd, 0); return n + (n === 1 ? ' peça prevista' : ' peças previstas'); };
const chipDif = d => d.dif < 0
  ? `<span class="dc f">Falta${-d.dif > 1 ? 'm' : ''} ${-d.dif} · ${esc(nomeTipo(d.tipoId))}</span>`
  : `<span class="dc s">Sobra${d.dif > 1 ? 'm' : ''} ${d.dif} · ${esc(nomeTipo(d.tipoId))}</span>`;
function anel(c, cls){
  const ok = c.total ? (c.ok + c.rearmada) / c.total * 100 : 0, no = c.total ? c.divergente / c.total * 100 : 0;
  return `<span class="ring ${cls || ''}" style="--a:${ok.toFixed(1)}%;--b:${(ok + no).toFixed(1)}%" aria-label="${c.conferidas} de ${c.total} salas conferidas"><span><b>${c.conferidas}</b>/${c.total}</span></span>`;
}
const blocoHead = (ic, titulo, sub, extra) => `<div class="bl-h"><span class="bl-ic">${ic}</span><span class="grow bl-t"><b>${titulo}</b>${sub ? `<span>${sub}</span>` : ''}</span>${extra || ''}</div>`;
// Cartão de movimento: de → para (null = depósito)
function movCard(de, para, qtd, tipoId, feito){
  const lado = id => id === null ? `<span class="sl dep">📦 Depósito</span>` : `<span class="sl">${esc(codigo(id))}</span>`;
  return `<div class="mov${feito ? ' feito' : ''}">${lado(de)} <span class="seta"><b>${qtd} ${esc(nomeTipo(tipoId))}</b><i></i></span> ${lado(para)}</div>`;
}
function proximaPendente(r, depoisDe){
  const l = S.catalogo.salas, regs = r.salas || {};
  const i0 = depoisDe ? l.findIndex(s => s.id === depoisDe) : -1;
  for (let k = 1; k <= l.length; k++) {
    const s = l[(i0 + k) % l.length];
    if (s.id !== depoisDe && !(regs[s.id] && regs[s.id].conferidaEm)) return s;
  }
  return null;
}
function avisoPendentes(r){
  const regs = r.salas || {};
  const pend = S.catalogo.salas.filter(s => !(regs[s.id] && regs[s.id].conferidaEm)).map(s => s.codigo);
  return pend.length ? `<div class="notice">⏳ Ainda falta conferir: <b>${pend.map(esc).join(', ')}</b>. A lista pode mudar.</div>` : '';
}

function viewLista(){
  const lista = Object.values(S.rearmes).sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  const novo = S.novo ? `<form class="panel pad" id="f-novo" style="display:flex;flex-direction:column;gap:12px">
      <h2>Novo rearme</h2>
      <div class="row">
        <label class="fld">Evento<input type="text" id="novo-nome" placeholder="Ex: Mariah Carey" maxlength="120" required></label>
        <label class="fld" style="flex:0 1 180px">Data do evento<input type="date" id="novo-data"></label>
      </div>
      <div class="row"><button class="btn pri" type="submit" style="flex:2 1 160px">✓ Criar rearme</button><button class="btn" type="button" data-a="cancelar-novo" style="flex:1 1 100px">Cancelar</button></div>
    </form>` : '';
  const itens = lista.map(r => {
    const c = resumo(r);
    const tag = c.pendente === 0 && c.total ? (c.divergente ? `<span class="chip no">Falta rearmar</span>` : `<span class="chip ok">Concluído ✓</span>`) : `<span class="chip">Em conferência</span>`;
    return `<button class="lst-i" data-a="abrir-rearme" data-id="${esc(r.id)}">
      ${anel(c)}
      <span class="lst-b">
        <span class="lst-t">${esc(r.nome)}</span>
        <span class="lst-m">${r.data ? '📅 ' + fmtData(r.data) : 'Sem data'}</span>
        <span class="row" style="gap:6px">${tag}${c.divergente ? `<span class="chip no">${c.divergente} com diferença</span>` : ''}${c.rearmada ? `<span class="chip ok">${c.rearmada} ${plural(c.rearmada, 'rearmada', 'rearmadas')}</span>` : ''}</span>
      </span>
      <span class="lst-go">›</span>
    </button>`;
  }).join('');
  return `<div class="row"><h1 class="grow">Rearmes</h1></div>
    <p class="muted" style="margin:0">Depois de cada evento, confira as salas. O sistema compara com o previsto e monta o que buscar, trocar e devolver.</p>
    ${pode('equipe') && !S.novo ? `<button class="btn pri big" data-a="novo">＋ Novo rearme</button>` : ''}
    ${novo}
    <section class="panel">${itens ? `<div class="lst">${itens}</div>` : `<div class="empty"><div class="big-ic">🛋️</div>Nenhum rearme ainda.${pode('equipe') ? '<br>Toque em "Novo rearme" depois do evento.' : ''}</div>`}</section>`;
}

function cardSala(s, reg){
  const st = statusSala(s, reg);
  const difs = st === 'divergente' ? diferencas(previsto(s), reg.contagem) : [];
  const ic = { pendente: '', ok: '✓', rearmada: '✓', divergente: '!' }[st];
  const rot = { pendente: 'A conferir', ok: 'Tudo certo', rearmada: 'Rearmada', divergente: `${difs.length} ${plural(difs.length, 'diferença', 'diferenças')}` }[st];
  let corpo = '';
  if (difs.length) corpo = `<span class="dcs">${difs.map(chipDif).join('')}</span>`;
  else if (st === 'pendente') corpo = `<span class="small muted">${pecas(s)}</span>`;
  else corpo = `<span class="small muted">👤 ${esc(reg.conferidaPor || '')} · ${fmtHora(reg.rearmadaEm || reg.conferidaEm)}</span>`;
  if (reg && reg.obs) corpo += `<span class="small muted">📝 ${esc(reg.obs)}</span>`;
  return `<button class="sala st-${st}" data-a="abrir-sala" data-id="${esc(s.id)}">
    <span class="sala-h"><span class="st-ic">${ic}</span><span class="grow"><span class="sala-t">${esc(s.codigo)}</span><span class="sala-c">${esc(s.nome)}</span></span><span class="st-rot">${rot}</span></span>
    ${corpo}
  </button>`;
}

function htmlSalasRearme(r){
  const regs = r.salas || {}, f = S.filtro;
  let h = f ? `<div class="row"><span class="chip">Mostrando: <b>${ROT_ST[f]}</b></span><button class="btn sm" data-a="filtro" data-f="${f}">✕ Mostrar todas</button></div>` : '';
  blocos().forEach(b => {
    const salas = b.salas.filter(s => !f || statusSala(s, regs[s.id]) === f);
    if (!salas.length) return;
    const conf = b.salas.filter(s => regs[s.id] && regs[s.id].conferidaEm).length;
    h += `<section class="bl">${blocoHead(ICONE_BLOCO(b.grupo), esc(b.nome), `${conf} de ${b.salas.length} ${plural(conf, 'conferida', 'conferidas')}`,
      `<span class="mini"><i style="width:${b.salas.length ? conf / b.salas.length * 100 : 0}%"></i></span>`)}
      <div class="grid">${salas.map(s => cardSala(s, regs[s.id])).join('')}</div></section>`;
  });
  return h || `<div class="panel empty">Nenhuma sala neste filtro.</div>`;
}

function htmlCruzamento(r, c, plano){
  if (!c.conferidas) return `<div class="panel empty"><div class="big-ic">🔀</div>O cruzamento aparece quando as primeiras salas forem conferidas.</div>`;
  const regs = r.salas || {};
  const rearmada = id => !!(regs[id] && regs[id].rearmadaEm);
  const soma = l => l.reduce((a, x) => a + x.qtd, 0);
  let h = avisoPendentes(r);
  h += `<p class="muted small" style="margin:0">Cada bloco mostra o que falta e o que sobra em cada sala. A sobra de uma sala cobre a falta de outra, primeiro dentro do mesmo bloco e só depois entre camarins e produção.</p>`;
  blocos().forEach(b => {
    const conferidas = b.salas.filter(s => regs[s.id] && regs[s.id].conferidaEm);
    const comDif = conferidas.filter(s => plano.porSala[s.id]);
    const semDif = conferidas.filter(s => !plano.porSala[s.id]);
    const pend = b.salas.filter(s => !(regs[s.id] && regs[s.id].conferidaEm));
    const trocas = plano.remanejar.filter(m => m.bloco !== null && m.bloco === b.grupo);
    const totF = comDif.reduce((a, s) => a + soma(plano.porSala[s.id].faltas), 0);
    const totS = comDif.reduce((a, s) => a + soma(plano.porSala[s.id].sobras), 0);
    h += `<section class="panel pad bl">
      ${blocoHead(ICONE_BLOCO(b.grupo), esc(b.nome), `${conferidas.length} de ${b.salas.length} ${plural(conferidas.length, 'conferida', 'conferidas')}`,
        comDif.length ? `<span class="tot">${totF ? `<span class="dc f" title="peças faltando">−${totF}</span>` : ''}${totS ? `<span class="dc s" title="peças sobrando">+${totS}</span>` : ''}</span>` : '')}
      ${comDif.length ? `<div class="cz">${comDif.map(s => { const d = plano.porSala[s.id]; return `<div class="cz-l${rearmada(s.id) ? ' feito' : ''}">
          <div class="cz-top"><button class="cod" data-a="abrir-sala" data-id="${esc(s.id)}">${esc(s.codigo)}</button>
          <span class="grow"></span>
          ${rearmada(s.id) ? `<span class="ok-tag">✓ Rearmada</span>` : pode('equipe') ? `<button class="btn sm ok" data-a="marcar-sala" data-id="${esc(s.id)}">✓ Marcar rearmada</button>` : ''}</div>
          <span class="dcs">${d.faltas.map(x => chipDif({ tipoId: x.tipoId, dif: -x.qtd })).join('')}${d.sobras.map(x => chipDif({ tipoId: x.tipoId, dif: x.qtd })).join('')}</span>
        </div>`; }).join('')}</div>` : ''}
      ${semDif.length ? `<p class="small" style="margin:0"><span class="ok-tag">✓ Sem diferença</span> ${semDif.map(s => esc(s.codigo)).join(', ')}</p>` : ''}
      ${pend.length ? `<p class="small muted" style="margin:0">⏳ A conferir: ${pend.map(s => esc(s.codigo)).join(', ')}</p>` : ''}
      ${comDif.length ? `<h4>🔁 Trocas entre ${esc(b.nome.toLowerCase())}</h4>${trocas.length
        ? `<div class="movs">${trocas.map(m => movCard(m.de, m.para, m.qtd, m.tipoId, rearmada(m.de) && rearmada(m.para))).join('')}</div>`
        : `<p class="vazio">Nenhuma troca possível dentro do bloco: o que falta numa sala não está sobrando em outra.</p>`}` : ''}
    </section>`;
  });
  const entre = plano.remanejar.filter(m => m.bloco === null);
  if (entre.length) h += `<section class="panel pad bl">${blocoHead('🔀', 'Entre camarins e produção', 'Mais longe: só depois das trocas dentro do bloco')}
    <div class="movs">${entre.map(m => movCard(m.de, m.para, m.qtd, m.tipoId, rearmada(m.de) && rearmada(m.para))).join('')}</div></section>`;
  h += `<button class="btn pri big no-print" data-a="aba" data-aba="lista">📋 Ver o que fazer</button>`;
  return h;
}

function htmlLista(r, c, plano){
  if (!c.conferidas) return `<div class="panel empty"><div class="big-ic">📋</div>A lista aparece aqui conforme as salas forem conferidas.</div>`;
  const regs = r.salas || {};
  const rearmada = id => !!(regs[id] && regs[id].rearmadaEm);
  const soma = l => l.reduce((a, x) => a + x.qtd, 0);
  const sec = (ic, tit, sub, n, corpo) => `<section class="panel pad bl">${blocoHead(ic, tit, sub, n !== null ? `<span class="cnt">${n}</span>` : '')}${corpo}</section>`;
  let h = avisoPendentes(r);
  if (!plano.buscar.length && !plano.remanejar.length && !plano.devolver.length) {
    h += `<div class="panel empty"><div class="big-ic">🎉</div>As salas conferidas estão iguais ao previsto. Nada a rearmar.</div>`;
  } else {
    blocos().forEach(b => {
      const t = plano.remanejar.filter(m => m.bloco !== null && m.bloco === b.grupo);
      if (t.length) h += sec('🔁', 'Trocas entre ' + esc(b.nome.toLowerCase()), 'Mesmo bloco: é só levar de uma sala para a outra', soma(t),
        `<div class="movs">${t.map(m => movCard(m.de, m.para, m.qtd, m.tipoId, rearmada(m.de) && rearmada(m.para))).join('')}</div>`);
    });
    const entre = plano.remanejar.filter(m => m.bloco === null);
    if (entre.length) h += sec('🔀', 'Entre camarins e produção', 'Mais longe', soma(entre),
      `<div class="movs">${entre.map(m => movCard(m.de, m.para, m.qtd, m.tipoId, rearmada(m.de) && rearmada(m.para))).join('')}</div>`);
    if (plano.buscar.length) h += sec('📦', 'Buscar no depósito', 'Nenhuma sala tem sobrando', soma(plano.buscar),
      `<div class="movs">${plano.buscar.map(m => movCard(null, m.para, m.qtd, m.tipoId, rearmada(m.para))).join('')}</div>`);
    if (plano.devolver.length) h += sec('↩️', 'Levar ao depósito', 'Está sobrando e nenhuma sala precisa', soma(plano.devolver),
      `<div class="movs">${plano.devolver.map(m => movCard(m.de, null, m.qtd, m.tipoId, rearmada(m.de))).join('')}</div>`);
  }
  const obs = S.catalogo.salas.filter(s => regs[s.id] && regs[s.id].obs);
  if (obs.length) h += sec('📝', 'Observações', '', obs.length, `<ul class="obs">${obs.map(s => `<li><b>${esc(s.codigo)}</b> ${esc(regs[s.id].obs)}</li>`).join('')}</ul>`);
  return h;
}

    const d = i.qtd - i.previsto;

    </div>
    ${so ? '' : `<p class="muted" style="margin:0">Conte o que está na sala agora. A lista já vem com o previsto: só ajuste o que estiver diferente.</p>

    <section class="panel"><div class="itens">${linhas}</div></section>
    ${so ? '' : `<div class="row">
      <select id="add-tipo" class="grow" style="flex:1 1 200px"><option value="">Item a mais na sala…</option>${opcoes.map(t => `<option value="${esc(t.id)}">${esc(t.nome)}</option>`).join('')}</select>
      <button class="btn" data-a="add-item">＋ Adicionar</button>

    <div class="row">
      <label class="fld">👤 Quem conferiu<input type="text" id="conferente" maxlength="80" value="${esc(R.conferidaPor)}" autocomplete="name"></label>
    </div>
    <label class="fld" style="flex:none">📝 Observação (opcional)<textarea id="obs" maxlength="1000" placeholder="Ex: espelho trincado, sofá manchado">${esc(R.obs)}</textarea></label>
    <div class="fixo">
      <button class="btn pri" data-a="salvar-conf">💾 Salvar</button>
      ${prox ? `<button class="btn ink duo" data-a="salvar-prox"><span>Salvar e próxima ▶</span><small>vai para a ${esc(prox.codigo)}</small></button>` : ''}
    </div>`}
    ${reg && reg.conferidaEm ? `<section class="panel pad" style="display:flex;flex-direction:column;gap:10px">
      <span class="small muted">👤 Conferida por ${esc(reg.conferidaPor)} em ${fmtHora(reg.conferidaEm)}${reg.rearmadaEm ? ` · rearmada em ${fmtHora(reg.rearmadaEm)}` : ''}</span>

function textoWhatsApp(r){
  const regs = r.salas || {};
  const plano = planoDe(r);
  let t = `🛋️ *REARME DAS SALAS*\n${r.nome}${r.data ? ' · ' + fmtData(r.data) : ''}\n`;
  const pend = S.catalogo.salas.filter(s => !(regs[s.id] && regs[s.id].conferidaEm)).map(s => s.codigo);
  if (pend.length) t += `⚠️ Falta conferir: ${pend.join(', ')}\n`;
  const troca = m => `• ${m.qtd} ${nomeTipo(m.tipoId)}: ${codigo(m.de)} → ${codigo(m.para)}`;
  const itensTxt = l => l.map(x => `${x.qtd} ${nomeTipo(x.tipoId)}`).join(', ');
  blocos().forEach(b => {
    const comDif = b.salas.filter(s => plano.porSala[s.id]);
    if (!comDif.length) return;
    const trocas = plano.remanejar.filter(m => m.bloco !== null && m.bloco === b.grupo);
    t += `\n${b.grupo === 'Camarim' ? '🎭' : b.grupo === 'Produção' ? '🎬' : '🚪'} *${b.nome.toUpperCase()}*\n` + comDif.map(s => {
      const d = plano.porSala[s.id];
      return `• ${s.codigo}:` + (d.faltas.length ? ` falta ${itensTxt(d.faltas)}` : '') + (d.faltas.length && d.sobras.length ? ';' : '') + (d.sobras.length ? ` sobra ${itensTxt(d.sobras)}` : '');
    }).join('\n') + '\n';
    if (trocas.length) t += `🔁 _Trocas dentro do bloco_\n` + trocas.map(troca).join('\n') + '\n';
  });
  const entre = plano.remanejar.filter(m => m.bloco === null);
  if (entre.length) t += `\n🔀 *Entre camarins e produção*\n` + entre.map(troca).join('\n') + '\n';
  if (plano.buscar.length) {
    const g = {}; plano.buscar.forEach(b => (g[b.tipoId] = g[b.tipoId] || []).push(b));
    t += `\n📦 *Buscar no depósito*\n` + Object.keys(g).map(k => `• ${g[k].reduce((a, b) => a + b.qtd, 0)} ${nomeTipo(k)} → ${g[k].map(b => `${codigo(b.para)} (${b.qtd})`).join(', ')}`).join('\n') + '\n';
  }
  if (plano.devolver.length) t += `\n↩️ *Levar ao depósito*\n` + plano.devolver.map(d => `• ${d.qtd} ${nomeTipo(d.tipoId)} da ${codigo(d.de)}`).join('\n') + '\n';
  if (!plano.buscar.length && !plano.remanejar.length && !plano.devolver.length) t += `\n✅ Salas conferidas iguais ao previsto.\n`;
  const obs = S.catalogo.salas.filter(s => regs[s.id] && regs[s.id].obs);
  if (obs.length) t += `\n📝 *Observações*\n` + obs.map(s => `• ${s.codigo}: ${regs[s.id].obs}`).join('\n') + '\n';
  return t;
}

// ---------- ações ----------
function abrirSala(id){
  const r = S.rearmes[S.rearmeId], sala = salaPorId(id);
  const reg = (r.salas || {})[id];
  const itens = sala.itens.map(i => ({ tipoId: i.tipoId, previsto: i.qtd, qtd: reg && reg.contagem && reg.contagem[i.tipoId] !== undefined ? reg.contagem[i.tipoId] : i.qtd }));
  if (reg && reg.contagem) Object.keys(reg.contagem).forEach(t => { if (!itens.some(i => i.tipoId === t)) itens.push({ tipoId: t, previsto: 0, qtd: reg.contagem[t] }); });
  let nome = ''; try { nome = localStorage.getItem('rearme_conferente') || ''; } catch (_) {}
  S.rasc = { itens, conferidaPor: (reg && reg.conferidaPor) || nome, obs: (reg && reg.obs) || '' };
  S.salaId = id; S.view = 'sala'; S.confirmar = null;
  render(); window.scrollTo(0, 0);
}
function lerCampos(){
  const c = document.getElementById('conferente'), o = document.getElementById('obs');
  if (S.rasc && c) S.rasc.conferidaPor = c.value;
  if (S.rasc && o) S.rasc.obs = o.value;
  const ec = document.getElementById('ed-codigo'), en = document.getElementById('ed-nome');
  if (S.ed && ec) S.ed.codigo = ec.value;
  if (S.ed && en) S.ed.nome = en.value;
}
const urlSala = () => `api/rearmes/${encodeURIComponent(S.rearmeId)}/salas/${encodeURIComponent(S.salaId)}`;

function salvarCatalogo(novo, msg){
  return gravar('PUT', 'api/catalogo', novo).then(() => { S.catalogo = novo; S.ed = null; S.view = 'salas'; render(); toast(msg); }, e => toast(e.msg));
}

app.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'f-senha') {
    api('POST', 'api/entrar', { senha: document.getElementById('senha').value })
      .then(() => { S.pedirSenha = false; iniciar(); }, e => toast(e.status === 401 ? 'Senha errada' : e.msg));
  }
  if (ev.target.id === 'f-novo') {
    const nome = document.getElementById('novo-nome').value.trim(), data = document.getElementById('novo-data').value;
    if (!nome) return toast('Informe o nome do evento');
    gravar('POST', 'api/rearmes', { nome, data }).then(d => { S.novo = false; S.rearmeId = d.id; S.view = 'rearme'; S.rearmes[d.id] = { id: d.id, nome, data, criadoEm: Date.now(), salas: {} }; render(); }, e => toast(e.msg));
  }
});

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  lerCampos();
  const a = b.dataset.a;
  const R = S.rasc, E = S.ed;
  const linha = b.closest('[data-tipo]');
  const tipo = linha && linha.dataset.tipo;
  switch (a) {
    case 'go-lista': S.view = 'lista'; S.copia = null; S.confirmar = null; break;
    case 'go-salas': S.view = 'salas'; S.ed = null; S.confirmar = null; break;
    case 'novo': S.novo = true; render(); document.getElementById('novo-nome').focus(); return;
    case 'cancelar-novo': S.novo = false; break;
    case 'abrir-rearme': S.rearmeId = b.dataset.id; S.view = 'rearme'; S.aba = 'salas'; S.filtro = null; S.copia = null; S.confirmar = null; render(); window.scrollTo(0, 0); return;
    case 'aba': S.aba = b.dataset.aba; break;
    case 'filtro': S.filtro = S.filtro === b.dataset.f ? null : b.dataset.f; S.aba = 'salas'; break;
    case 'proxima': { const p = proximaPendente(S.rearmes[S.rearmeId]); if (p) return abrirSala(p.id); return toast('Todas as salas já foram conferidas'); }
    case 'marcar-sala': {
      const id = b.dataset.id, reg = clone(S.rearmes[S.rearmeId].salas[id]);
      reg.rearmadaEm = new Date().toISOString();
      S.rearmes[S.rearmeId].salas[id] = reg;
      gravar('PUT', `api/rearmes/${encodeURIComponent(S.rearmeId)}/salas/${encodeURIComponent(id)}`, reg).then(() => toast(`${codigo(id)} rearmada!`), e => toast(e.msg));
      break;
    }
    case 'copiar-link': {
      const url = location.origin + location.pathname + '#r=' + S.rearmeId;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => toast('Link copiado! Mande para quem precisa ver.'), () => { S.copia = url; render(); });
        return;
      }
      S.copia = url; break;
    }
    case 'ed-grupo': E.grupo = b.dataset.g; break;
    case 'voltar-rearme': S.view = 'rearme'; S.rasc = null; S.confirmar = null; break;
    case 'abrir-sala': return abrirSala(b.dataset.id);
    case 'menos': { const i = R.itens.find(x => x.tipoId === tipo); i.qtd = Math.max(0, i.qtd - 1); break; }
    case 'mais': { const i = R.itens.find(x => x.tipoId === tipo); i.qtd = Math.min(999, i.qtd + 1); break; }
    case 'remover-item': R.itens = R.itens.filter(x => x.tipoId !== tipo); break;
    case 'tudo-certo': R.itens = R.itens.filter(x => x.previsto > 0); R.itens.forEach(x => { x.qtd = x.previsto; }); break;
    case 'add-item': {
      const t = document.getElementById('add-tipo').value;
      if (!t) return toast('Escolha o item na lista');
      R.itens.push({ tipoId: t, previsto: 0, qtd: 1 }); break;
    }
    case 'salvar-conf': case 'salvar-prox': {
      const quem = (R.conferidaPor || '').trim();
      if (!quem) { toast('Informe quem conferiu'); document.getElementById('conferente').focus(); return; }
      try { localStorage.setItem('rearme_conferente', quem); } catch (_) {}
      const contagem = {};
      R.itens.forEach(i => { if (i.previsto > 0 || i.qtd > 0) contagem[i.tipoId] = i.qtd; });
      const ant = (S.rearmes[S.rearmeId].salas || {})[S.salaId];
      const sala = salaPorId(S.salaId);
      const iguais = diferencas(previsto(sala), contagem).length === 0;
      const reg = { contagem, obs: (R.obs || '').trim(), conferidaPor: quem, conferidaEm: new Date().toISOString() };
      // conferir de novo uma sala já rearmada mantém a marcação só se continuar tudo certo
      if (ant && ant.rearmadaEm && iguais) reg.rearmadaEm = ant.rearmadaEm;
      const rr = S.rearmes[S.rearmeId]; rr.salas = rr.salas || {}; rr.salas[S.salaId] = reg;
      gravar('PUT', urlSala(), reg).then(() => toast(iguais ? `${sala.codigo}: tudo certo!` : `${sala.codigo} salva. Diferenças no cruzamento.`), e => toast(e.msg));
      const prox = a === 'salvar-prox' && proximaPendente(rr, S.salaId);
      if (prox) return abrirSala(prox.id);
      S.view = 'rearme'; S.rasc = null; render(); window.scrollTo(0, 0); return;
    }
    case 'marcar': case 'desmarcar': {
      const reg = clone(S.rearmes[S.rearmeId].salas[S.salaId]);
      if (a === 'marcar') reg.rearmadaEm = new Date().toISOString(); else delete reg.rearmadaEm;
      S.rearmes[S.rearmeId].salas[S.salaId] = reg;
      gravar('PUT', urlSala(), reg).then(() => toast(a === 'marcar' ? `${codigo(S.salaId)} rearmada!` : 'Marcação desfeita'), e => toast(e.msg));
      if (a === 'marcar') { S.view = 'rearme'; S.rasc = null; }
      break;
    }
    case 'apagar-conf': S.confirmar = 'apagar-conf'; break;
    case 'apagar-conf-sim':
      delete S.rearmes[S.rearmeId].salas[S.salaId];
      gravar('DELETE', urlSala()).catch(e => toast(e.msg));
      S.view = 'rearme'; S.rasc = null; S.confirmar = null; break;
    case 'cancelar-conf': S.confirmar = null; break;
    case 'apagar-rearme': S.confirmar = 'apagar-rearme'; break;
    case 'apagar-rearme-sim': {
      const id = S.rearmeId; delete S.rearmes[id];
      gravar('DELETE', 'api/rearmes/' + encodeURIComponent(id)).then(() => toast('Rearme apagado'), e => toast(e.msg));
      S.view = 'lista'; S.confirmar = null; break;
    }
    case 'copiar': {
      const txt = textoWhatsApp(S.rearmes[S.rearmeId]);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => toast('Lista copiada! É só colar no WhatsApp.'), () => { S.copia = txt; render(); });
        return;
      }
      S.copia = txt; break;
    }
    case 'copiar-de-novo': { const t = document.getElementById('copia'); t.select(); try { document.execCommand('copy'); toast('Copiado!'); } catch (_) { toast('Selecione o texto e copie'); } return; }
    case 'fechar-copia': S.copia = null; break;
    case 'imprimir': S.aba = 'lista'; render(); window.print(); return;
    // edição do previsto
    case 'editar-sala': { const s = salaPorId(b.dataset.id); S.ed = { ...clone(s), nova: false }; S.view = 'salaEd'; S.confirmar = null; render(); window.scrollTo(0, 0); return; }
    case 'nova-sala': S.ed = { id: '', codigo: '', nome: '', grupo: '', itens: [], nova: true }; S.view = 'salaEd'; S.confirmar = null; render(); window.scrollTo(0, 0); return;
    case 'ed-menos': { const i = E.itens.find(x => x.tipoId === tipo); i.qtd = Math.max(1, i.qtd - 1); break; }
    case 'ed-mais': { const i = E.itens.find(x => x.tipoId === tipo); i.qtd = Math.min(999, i.qtd + 1); break; }
    case 'ed-remover': E.itens = E.itens.filter(x => x.tipoId !== tipo); break;
    case 'ed-add': {
      const nome = document.getElementById('ed-add').value.trim();
      if (!nome) return toast('Escreva o nome do item');
      let t = Object.values(S.catalogo.tipos).find(x => slug(x.nome) === slug(nome));
      if (!t) {
        // item novo: entra na lista da arena quando a sala for salva
        const id = slug(nome);
        if (!id) return toast('Nome inválido');
        t = { id, nome };
        E.novosTipos = E.novosTipos || {}; E.novosTipos[id] = t;
        S.catalogo.tipos = { ...S.catalogo.tipos, [id]: t };
      }
      if (E.itens.some(x => x.tipoId === t.id)) return toast('Esse item já está na lista');
      E.itens.push({ tipoId: t.id, qtd: 1 }); break;
    }
    case 'ed-salvar': {
      const cod = (E.codigo || '').trim(), nome = (E.nome || '').trim();
      if (!cod || !nome) return toast('Preencha o código e o nome da sala');
      if (!E.itens.length) return toast('Adicione pelo menos um item');
      const novo = clone(S.catalogo);
      novo.tipos = { ...novo.tipos, ...(E.novosTipos || {}) };
      const id = E.nova ? slug(cod) : E.id;
      if (!id) return toast('Código inválido');
      if (E.nova && novo.salas.some(s => s.id === id)) return toast('Já existe uma sala com esse código');
      // Sem bloco escolhido: usa o bloco das outras salas com a mesma letra (C → Camarim, T → Produção).
      const grupo = E.grupo || ((novo.salas.find(s => s.id !== id && s.grupo && s.codigo[0].toUpperCase() === cod[0].toUpperCase()) || {}).grupo) || '';
      const sala = { id, codigo: cod, nome, grupo, itens: E.itens.map(i => ({ tipoId: i.tipoId, qtd: i.qtd })) };
      if (E.nova) novo.salas.push(sala); else novo.salas = novo.salas.map(s => s.id === id ? sala : s);
      salvarCatalogo(novo, E.nova ? `${cod} criada` : `${cod} atualizada`); return;
    }
    case 'apagar-sala': S.confirmar = 'apagar-sala'; break;
    case 'apagar-sala-sim': {
      const novo = clone(S.catalogo); novo.salas = novo.salas.filter(s => s.id !== E.id);
      S.confirmar = null; salvarCatalogo(novo, `${E.codigo} retirada`); return;
    }
    default: return;
  }
  render();
});

render();
iniciar();
})();
</script>
