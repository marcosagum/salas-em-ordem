<title>Salas em Ordem · Farmasi Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
/* Mesmo visual do calendário da arena e do checklist pré-show: barra vermelho-escura,
   Onest, títulos em maiúsculas, cartões brancos arredondados, botões em pílula e ícones de traço */
:root{
  --paper:#f6f5f3; --card:#ffffff; --ink:#0a0a0a; --muted:#717784; --line:#e6e8ec; --ghost:#d7dae1;
  --band:#a10f12; --band-ink:#ffffff; --brand:#e11518; --brand-deep:#a10f12; --brand-light:#ed7374;
  --ok:#15803d; --ok-bg:#e4f4ea; --no:#e11518; --no-bg:#fdecec; --warn:#b45309; --warn-bg:#fdf0da;
  --chip:#eeece9; --focus:#ed7374;
  --r-card:20px; --r-pill:999px; --r-field:12px;
  --f:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.i.sm{width:14px;height:14px}
.i.lg{width:22px;height:22px}

/* faixa */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--band);color:var(--band-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:64px;padding-block:10px}
.mark{width:44px;height:44px;flex:none;display:block;border-radius:8px}
.brand-t{font-size:16px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;line-height:1.1;white-space:nowrap}
.brand-s{display:inline-block;margin-top:3px;font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r-pill);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.75)}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{background:transparent;border:0;color:rgba(255,255,255,.6);padding:8px 14px;border-radius:var(--r-pill);font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.tab:hover{color:#fff;background:rgba(255,255,255,.1)}
.tab[aria-current="page"]{color:#fff;background:rgba(255,255,255,.15)}

/* base */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance;text-transform:uppercase}
h1{font-size:28px;line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{font-size:12px;letter-spacing:.22em;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:6px;border-radius:var(--r-pill);background:var(--brand);flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card)}
.pad{padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.fld{display:flex;flex-direction:column;gap:8px;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);flex:1 1 180px;min-width:0}
input[type=text],input[type=date],input[type=password],textarea,select{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-field);padding:11px 14px;font-size:15px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--brand-light);outline:none}
textarea{resize:vertical;min-height:64px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r-pill);padding:0 16px;font-weight:500;font-size:12px;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#0f6a32;border-color:#0f6a32}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--no)}
.btn.danger:hover{background:var(--no);color:#fff;border-color:var(--no)}
.btn.big{min-height:50px;width:100%;border-radius:14px}
.btn.sm{min-height:34px;padding:0 12px;font-size:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.duo{flex-direction:column;gap:1px;line-height:1.2}
.btn.duo small{font-size:10px;letter-spacing:.04em;opacity:.7;text-transform:none;font-weight:400}
.ico{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.ico:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.ico.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.link{background:none;border:none;padding:4px 0;color:var(--muted);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:4px;text-align:left}
.link:hover{color:var(--ink)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:var(--r-pill);background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.no{background:var(--no-bg);color:var(--no)}
.chip b{color:var(--ink);font-weight:600}
.dc{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap}
.dc.f{background:var(--no-bg);color:var(--no)}
.dc.s{background:var(--warn-bg);color:var(--warn)}
.dc.n{background:var(--paper);border:1px solid var(--line);color:var(--ink);font-weight:400}
.dc.n b{font-weight:600}
.dcs{display:flex;flex-wrap:wrap;gap:5px}
.falta{color:var(--no);font-weight:500}
.sobra{color:var(--warn);font-weight:500}
.certo{color:var(--ok);font-weight:600}
.notice{display:flex;gap:10px;align-items:flex-start;border:1px solid rgba(180,83,9,.3);background:var(--warn-bg);color:#7c3a06;padding:10px 14px;border-radius:var(--r-field);font-size:13.5px}
.notice .i{margin-top:2px}
.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .i{width:32px;height:32px;stroke-width:1.5;color:var(--ghost)}
.copybox textarea{min-height:200px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-size:13px;font-weight:500;z-index:20;max-width:calc(100% - 32px)}

/* lista de checagens */
.lst{display:flex;flex-direction:column}
.lst-i{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.lst-i:first-child{border-top:0}
.lst-i:hover{background:var(--paper)}
.lst-b{display:flex;flex-direction:column;gap:5px;min-width:0}
.lst-t{font-weight:500;font-size:17px;text-transform:uppercase;overflow-wrap:anywhere}
.lst-m{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.lst-go{color:var(--ghost)}

/* anel de progresso */
.ring{--a:0%;--b:0%;position:relative;width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) 0 var(--a),var(--no) 0 var(--b),var(--chip) 0)}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ring span b{font-size:16px;color:var(--ink);font-weight:600}
.ring.g{width:72px;height:72px}
.ring.g::before{inset:8px}
.ring.g span b{font-size:21px}

/* painel da checagem */
.resumo{display:flex;align-items:center;gap:14px;padding:12px 14px}
.tiles{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;min-width:0}
.tile{border:1px solid transparent;border-radius:12px;background:var(--paper);padding:8px 8px 7px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;transition:border-color .2s,background .2s}
.tile b{font-size:21px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:10px;font-weight:500;letter-spacing:.03em;line-height:1.2;text-transform:uppercase;color:var(--muted)}
.tile:hover{border-color:var(--ghost)}
.tile[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.t-no b{color:var(--no)} .t-ok b,.t-rea b{color:var(--ok)}

.acoes{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}
.acoes .btn{min-height:48px;border-radius:14px;padding:0 8px;gap:6px;letter-spacing:.02em}
.acoes .btn.pri[disabled]{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok);opacity:1}

.seg{display:flex;gap:4px;background:var(--chip);border-radius:var(--r-pill);padding:4px}
.seg button{flex:1 1 auto;min-width:0;border:0;background:none;border-radius:var(--r-pill);min-height:40px;padding:0 8px;font-size:11.5px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg .n{background:var(--brand);color:#fff;border-radius:var(--r-pill);font-size:10px;padding:1px 7px;letter-spacing:0}

/* grade de salas (compacta) */
.gr-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gr-h .grow{display:flex;align-items:center;gap:8px}
.gr-h + *{margin-top:8px}
.gr + .gr{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mini{width:56px;height:5px;border-radius:var(--r-pill);background:var(--chip);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--ok)}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.sala{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;min-height:62px;padding:8px 9px;border-radius:12px;border:1px dashed var(--ghost);background:var(--card);text-align:left;width:100%;transition:transform .1s,border-color .2s}
.sala:hover{border-color:var(--ink)}
.sala:active{transform:scale(.97)}
.sala b{font-size:15px;font-weight:600;line-height:1}
.sala small{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;letter-spacing:.02em;color:var(--muted);flex-wrap:wrap}
.sala.st-ok{border:1px solid transparent;background:var(--ok-bg)}
.sala.st-ok small{color:var(--ok)}
.sala.st-rearmada{border:1px solid var(--ok);background:var(--ok);color:#fff}
.sala.st-rearmada small{color:rgba(255,255,255,.9)}
.sala.st-divergente{border:1px solid rgba(225,21,24,.4);background:var(--no-bg)}
.legenda{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* tabela de cruzamento e lista do que fazer */
.tb{display:flex;flex-direction:column}
.tb-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border-top:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tb-h:first-child{border-top:0;border-radius:var(--r-card) var(--r-card) 0 0}
.tb-h .grow{display:flex;align-items:center;gap:8px}
.tb-h .ct{min-width:24px;height:22px;padding:0 8px;border-radius:var(--r-pill);background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;letter-spacing:0}
.tb-l{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);min-height:52px}
.tb-l.feito{opacity:.5}
.tb-l.feito .mv-i{text-decoration:line-through}
.tb-n{padding:8px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cod{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:6px 8px;font-weight:600;font-size:13px;flex:none;min-width:48px;text-align:center}
.cod.dep{background:var(--warn-bg);color:var(--warn);display:inline-flex;align-items:center;gap:4px}
.cod.lt{background:var(--chip);color:var(--ink)}
.mv{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mv .seta{color:var(--brand-light);flex:none}
.mv-i{font-size:14px;margin-left:4px;min-width:0}
.mv-i b{font-weight:600}
.ok-tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ok)}

/* o que fazer: um cartão por tipo de ação, cada um com sua cor */
.k-bloco{--c:#1d4ed8;--cb:#eef3fe}
.k-entre{--c:#7c3aed;--cb:#f4effe}
.k-buscar{--c:#b45309;--cb:#fdf3e1}
.k-levar{--c:#0f766e;--cb:#e6f4f2}
.k-obs{--c:#52525b;--cb:#f1f1f2}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px;align-items:start}
.act{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:16px;overflow:hidden}
.act-h{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--cb)}
.act-ic{width:38px;height:38px;flex:none;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center}
.act-t{display:flex;flex-direction:column;gap:2px}
.act-t b{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.act-t span{font-size:12px;color:var(--muted);line-height:1.3}
.act-ct{display:flex;flex-direction:column;align-items:center;flex:none;line-height:1;color:var(--c);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.act-ct small{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted);margin-top:3px}
.act-b .tb-l:first-child{border-top:0}
.mvl .seta{color:var(--c)}
.mvl .q{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 7px;margin-right:2px;border-radius:var(--r-pill);background:var(--cb);color:var(--c);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.mvl .ok-tag{margin-left:auto}
.kd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:middle}

/* conferência */
.sala-top{display:flex;align-items:center;gap:12px}
.bl-ic{width:42px;height:42px;flex:none;border-radius:12px;background:var(--chip);display:grid;place-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:var(--r-pill);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.no{background:var(--no-bg);color:var(--no)}
.itens{display:flex;flex-direction:column;border-radius:var(--r-card);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);border-left:4px solid transparent}
.it:first-child{border-top:0}
.it.d-falta{border-left-color:var(--no);background:var(--no-bg)}
.it.d-sobra{border-left-color:var(--warn);background:var(--warn-bg)}
.it-n{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.it-n b{font-weight:500;overflow-wrap:anywhere}
.it-n span{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:42px;height:42px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.step button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.step output{min-width:30px;text-align:center;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;flex:none;display:grid;place-items:center;padding:0}
.x:hover{color:var(--no)}
.fixo{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;padding:14px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(246,245,243,0),var(--paper) 35%)}
.fixo .btn{flex:1 1 0;min-height:52px;border-radius:14px}
.fixo .btn.ink{flex-grow:1.5}

/* previsto das salas */
.cat-l{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.cat-l .grow{display:flex;flex-direction:column;gap:6px}
.cat-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cat-t b{font-weight:600;font-size:15px}
.cat-t span{font-size:12.5px;color:var(--muted)}

/* impressão (só aparece no papel) */
.imp{display:none}

@media (max-width:560px){
  .band-in{flex-wrap:wrap}
  .tabs{margin-left:0;width:100%}
  h1{font-size:23px}
  .resumo{gap:10px;padding:10px}
  .ring.g{width:60px;height:60px}
  .ring.g::before{inset:7px}
  .ring.g span b{font-size:18px}
  .tile{padding:7px 6px 6px}
  .tile b{font-size:19px}
  .tile span{font-size:9px}
}

@media print{
  @page{size:A4;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12px}
  body::before,.band,.toast{display:none!important}
  main{padding:0}
  #app > :not(.imp){display:none!important}
  .imp{display:flex;flex-direction:column;gap:14px}
  .imp-band{display:flex;align-items:center;gap:12px;background:var(--band);color:#fff;border-radius:14px;padding:12px 16px}
  .imp-band img{width:40px;height:40px;border-radius:6px}
  .imp-band .t{font-size:14px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
  .imp-band .s{display:inline-block;margin-top:2px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:1px 8px;color:rgba(255,255,255,.85)}
  .imp-band .ev{margin-left:auto;text-align:right}
  .imp-band .ev b{display:block;font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
  .imp-band .ev span{font-size:10.5px;color:rgba(255,255,255,.8)}
  .imp-st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .imp-st div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
  .imp-st b{display:block;font-size:20px;font-weight:600}
  .imp-st span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .imp-sec{border:1px solid var(--line);border-radius:12px;overflow:hidden;break-inside:avoid}
  .imp-sec h3{margin:0;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:11px;letter-spacing:.12em;background:var(--chip);color:var(--ink)}
  .imp-sec h3::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--brand)}

<script>
(() => {
const app = document.getElementById('app');
const toastEl = document.getElementById('toast');

const S = {
  papel: null, pedirSenha: false, erro: '', carregou: false,
  catalogo: { tipos: {}, salas: [] }, rearmes: {},
  view: 'lista', rearmeId: null, salaId: null,
  rasc: null,        // conferência em andamento: { itens: [{tipoId, previsto, qtd}], conferidaPor, obs }
  ed: null,          // edição do previsto: { id, codigo, nome, grupo, itens: [{tipoId, qtd}], nova }
  novo: false, copia: null, confirmar: null,
  aba: 'salas',      // dentro do rearme: 'salas' | 'cruz' | 'lista'
  filtro: null       // filtro das salas: null | 'pendente' | 'divergente' | 'ok' | 'rearmada'
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const fmtData = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const fmtHora = iso => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
const slug = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
const pode = min => ({ consulta: 1, equipe: 2, admin: 3 })[S.papel] >= ({ consulta: 1, equipe: 2, admin: 3 })[min];
let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 2800); }

// ---------- servidor ----------
async function api(metodo, url, corpo){
  const r = await fetch(url, { method: metodo, headers: corpo ? { 'content-type': 'application/json' } : {}, body: corpo ? JSON.stringify(corpo) : undefined, credentials: 'same-origin', cache: 'no-store' });
  if (r.status === 401 && url !== 'api/entrar') { S.pedirSenha = true; render(); throw { msg: 'Entre com a senha' }; }
  const d = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw { msg: (d && d.erro) || 'Sem conexão com o servidor', status: r.status };
  return d;
}
let gravando = 0, recarregarDepois = false;
async function recarregar(){
  if (gravando) { recarregarDepois = true; return; }
  const d = await api('GET', 'api/dados');
  S.catalogo = d.catalogo || { tipos: {}, salas: [] };
  S.rearmes = d.rearmes || {};
  S.papel = d.papel || null;
  S.carregou = true; S.pedirSenha = false;
  if (S.view !== 'lista' && S.view !== 'salas' && S.view !== 'salaEd' && !S.rearmes[S.rearmeId]) S.view = 'lista';
  // não redesenha enquanto alguém digita (a mudança aparece no próximo toque)
  const foco = document.activeElement;
  if (foco && app.contains(foco) && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName)) return;
  render();
}
async function gravar(metodo, url, corpo){
  gravando++;
  try { return await api(metodo, url, corpo); }
  finally { gravando--; if (!gravando) { recarregarDepois = false; recarregar().catch(() => {}); } }
}
let aoVivo = false;
function ligarAoVivo(){
  if (aoVivo) return; aoVivo = true;
  try { const es = new EventSource('api/eventos'); es.onmessage = () => recarregar().catch(() => {}); } catch (_) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden) recarregar().catch(() => {}); });
  setInterval(() => { if (!document.hidden) recarregar().catch(() => {}); }, 60000);
}
// Link direto para um rearme (#r=<id>), para mandar ao outro setor já no evento certo
let linkPronto = false;
function abrirPeloLink(){
  linkPronto = true;
  const p = new URLSearchParams(location.hash.slice(1));
  const r = p.get('r');
  if (!r || !S.rearmes[r]) return;
  S.rearmeId = r; S.view = 'rearme';
  const s = p.get('s');
  if (s && salaPorId(s)) abrirSala(s); else render();
}
window.addEventListener('hashchange', () => { if (S.carregou) abrirPeloLink(); });
function marcarLink(){
  if (!linkPronto) return;
  const h = S.view === 'rearme' || S.view === 'sala' ? '#r=' + S.rearmeId : '';
  if (location.hash !== h) history.replaceState(null, '', h || location.pathname);
}
function iniciar(){
  recarregar().then(() => { ligarAoVivo(); abrirPeloLink(); }, e => { if (!S.pedirSenha) { S.erro = 'Não foi possível falar com o servidor. Verifique a internet e recarregue a página.'; render(); } });
}

// ---------- regras ----------
const nomeTipo = id => (S.catalogo.tipos[id] && S.catalogo.tipos[id].nome) || id;
const salaPorId = id => S.catalogo.salas.find(s => s.id === id);
const codigo = id => { const s = salaPorId(id); return s ? s.codigo : id; };
function previsto(sala){ const o = {}; (sala.itens || []).forEach(i => { o[i.tipoId] = (o[i.tipoId] || 0) + i.qtd; }); return o; }

function diferencas(prev, cont){
  const ids = [...Object.keys(prev || {})];
  Object.keys(cont || {}).forEach(id => { if (!ids.includes(id)) ids.push(id); });
  const out = [];
  ids.forEach(id => {
    const p = Number((prev || {})[id]) || 0;
    const c = cont && cont[id] !== undefined && cont[id] !== null ? Number(cont[id]) || 0 : p;
    if (c !== p) out.push({ tipoId: id, previsto: p, contado: c, dif: c - p });
  });
  return out;
}

// A sobra de uma sala cobre a falta de outra (mesmo item) antes de ir ao depósito.
// Primeiro dentro do mesmo bloco (camarim com camarim, produção com produção),
// depois entre blocos (mais longe) e só então o depósito.
//   prevPorSala: { salaId: { tipoId: qtd } }   contagens: [[salaId, { tipoId: qtd }], ...]
//   grupoDe: { salaId: 'Camarim' | 'Produção' | ... } (opcional)
function calcularPlano(prevPorSala, contagens, grupoDe){
  const gr = id => (grupoDe && grupoDe[id]) || '';
  const porTipo = {}, ordem = [], porSala = {};
  contagens.forEach(([salaId, cont]) => {
    diferencas(prevPorSala[salaId] || {}, cont || {}).forEach(d => {
      if (!porTipo[d.tipoId]) { porTipo[d.tipoId] = { faltas: [], sobras: [] }; ordem.push(d.tipoId); }
      if (!porSala[salaId]) porSala[salaId] = { faltas: [], sobras: [] };
      if (d.dif < 0) { porTipo[d.tipoId].faltas.push({ salaId, qtd: -d.dif }); porSala[salaId].faltas.push({ tipoId: d.tipoId, qtd: -d.dif }); }
      else { porTipo[d.tipoId].sobras.push({ salaId, qtd: d.dif }); porSala[salaId].sobras.push({ tipoId: d.tipoId, qtd: d.dif }); }
    });
  });
  const remanejar = [], buscar = [], devolver = [];
  const casar = (tipoId, sobras, faltas, mesmoBloco) => {
    sobras.forEach(s => faltas.forEach(f => {
      if (!s.qtd || !f.qtd) return;
      if (mesmoBloco && gr(s.salaId) !== gr(f.salaId)) return;
      const n = Math.min(s.qtd, f.qtd);
      remanejar.push({ tipoId, de: s.salaId, para: f.salaId, qtd: n, bloco: mesmoBloco ? gr(s.salaId) : null });
      s.qtd -= n; f.qtd -= n;
    }));
  };
  ordem.forEach(tipoId => {
    const faltas = porTipo[tipoId].faltas.map(x => ({ ...x })), sobras = porTipo[tipoId].sobras.map(x => ({ ...x }));
    casar(tipoId, sobras, faltas, true);
    casar(tipoId, sobras, faltas, false);
    faltas.forEach(f => { if (f.qtd > 0) buscar.push({ tipoId, para: f.salaId, qtd: f.qtd }); });
    sobras.forEach(s => { if (s.qtd > 0) devolver.push({ tipoId, de: s.salaId, qtd: s.qtd }); });
  });
  return { remanejar, buscar, devolver, porSala };
}
// Blocos na ordem em que aparecem nas salas: [{ grupo, nome, salas: [sala] }]
const NOME_BLOCO = { 'Camarim': 'Camarins', 'Produção': 'Salas de produção' };
function blocos(){
  const out = [], idx = {};
  S.catalogo.salas.forEach(s => {
    const g = s.grupo || '';
    if (!(g in idx)) { idx[g] = out.length; out.push({ grupo: g, nome: NOME_BLOCO[g] || g || 'Outras salas', salas: [] }); }
    out[idx[g]].salas.push(s);
  });
  return out;
}
const nomeBloco = g => NOME_BLOCO[g] || g || 'Outras salas';
window.calcularPlano = calcularPlano;

function statusSala(sala, reg){
  if (!reg || !reg.conferidaEm) return 'pendente';
  if (reg.rearmadaEm) return 'rearmada';
  return diferencas(previsto(sala), reg.contagem).length ? 'divergente' : 'ok';
}
function resumo(r){
  const c = { total: S.catalogo.salas.length, pendente: 0, ok: 0, divergente: 0, rearmada: 0 };
  S.catalogo.salas.forEach(s => { c[statusSala(s, (r.salas || {})[s.id])]++; });
  c.conferidas = c.total - c.pendente;
  return c;
}
function planoDe(r){
  const prev = {}, conts = [];
  S.catalogo.salas.forEach(s => {
    prev[s.id] = previsto(s);
    const reg = (r.salas || {})[s.id];
    if (reg && reg.conferidaEm) conts.push([s.id, reg.contagem || {}]);
  });
  const grupoDe = {}; S.catalogo.salas.forEach(s => { grupoDe[s.id] = s.grupo || ''; });
  return calcularPlano(prev, conts, grupoDe);
}
const plural = (n, um, varios) => n === 1 ? um : varios;

// ---------- telas ----------
function render(){
  lerCampos();
  document.getElementById('tabs').hidden = !S.carregou || S.pedirSenha;
  document.getElementById('tab-lista').setAttribute('aria-current', ['lista', 'rearme', 'sala'].includes(S.view) ? 'page' : 'false');
  document.getElementById('tab-salas').setAttribute('aria-current', ['salas', 'salaEd'].includes(S.view) ? 'page' : 'false');
  if (S.pedirSenha) { app.innerHTML = viewSenha(); return; }
  if (S.erro) { app.innerHTML = `<div class="panel empty">${esc(S.erro)}</div>`; return; }
  if (!S.carregou) { app.innerHTML = `<div class="panel empty">Carregando…</div>`; return; }
  const v = { lista: viewLista, rearme: viewRearme, sala: viewSala, salas: viewSalas, salaEd: viewSalaEd }[S.view] || viewLista;
  app.innerHTML = v();
  marcarLink();
}

function viewSenha(){
  return `<section class="panel pad" style="max-width:440px;margin:24px auto;display:flex;flex-direction:column;gap:12px">
    <h2>Entrar</h2>
    <p class="muted" style="margin:0">Digite a senha que você recebeu.</p>
    <form id="f-senha" class="row" style="align-items:flex-end">
      <label class="fld">Senha<input type="password" id="senha" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit">Entrar</button>
    </form>
  </section>`;
}

// ---------- ícones (traço fino, mesma linha do front-end) ----------
const IC = {
  play: '<path d="M7 4.5v15l12-7.5z"/>',
  msg: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  printer: '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  box: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/>',
  swap: '<path d="m2 9 3-3 3 3"/><path d="M13 18H7a2 2 0 0 1-2-2V6"/><path d="m22 15-3 3-3-3"/><path d="M11 6h6a2 2 0 0 1 2 2v10"/>',
  shuffle: '<path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.97a4 4 0 0 0 3.3-1.7l5.45-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.97a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.04a4 4 0 0 1-3.3-1.8l-.36-.45"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  checkc: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>',
  note: '<path d="M15 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M15 3v5h5"/><path d="M8 13h8"/><path d="M8 17h5"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  minus: '<path d="M5 12h14"/>',
  save: '<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  shirt: '<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>',
  case: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  door: '<path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.56v16.16a1 1 0 0 1-1.24.97L5 20V5.56a2 2 0 0 1 1.52-1.94l4-1A2 2 0 0 1 13 4.56Z"/>',
  arrow: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  rotate: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  sofa: '<path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/><path d="M2 16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z"/><path d="M4 18v2"/><path d="M20 18v2"/>',
  list: '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>'
};
const ic = (n, cls) => `<svg class="i${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;
const iconeBloco = g => g === 'Camarim' ? 'shirt' : g === 'Produção' ? 'case' : 'door';

const ROT_ST = { pendente: 'A conferir', divergente: 'Com diferença', ok: 'Sem diferença', rearmada: 'Em ordem' };
const pecas = s => { const n = (s.itens || []).reduce((a, i) => a + i.qtd, 0); return n + (n === 1 ? ' peça prevista' : ' peças previstas'); };
const chipDif = d => d.dif < 0
  ? `<span class="dc f">Falta${-d.dif > 1 ? 'm' : ''} ${-d.dif} · ${esc(nomeTipo(d.tipoId))}</span>`
  : `<span class="dc s">Sobra${d.dif > 1 ? 'm' : ''} ${d.dif} · ${esc(nomeTipo(d.tipoId))}</span>`;
function anel(c, cls){
  const ok = c.total ? (c.ok + c.rearmada) / c.total * 100 : 0, no = c.total ? c.divergente / c.total * 100 : 0;
  return `<span class="ring ${cls || ''}" style="--a:${ok.toFixed(1)}%;--b:${(ok + no).toFixed(1)}%" aria-label="${c.conferidas} de ${c.total} salas conferidas"><span><b>${c.conferidas}</b>/${c.total}</span></span>`;
}
// Tipos de ação: cada um com cor e ícone próprios (k-bloco azul, k-entre roxo, k-buscar âmbar, k-levar verde-azulado)
const ACAO = {
  bloco: { ic: 'swap', sub: 'Mesmo bloco · perto: leve de uma sala para a outra' },
  entre: { ic: 'shuffle', sub: 'Outro bloco · mais longe: só depois das trocas perto' },
  buscar: { ic: 'box', sub: 'Nenhuma sala tem sobrando: pegue no depósito' },
  levar: { ic: 'undo', sub: 'Está sobrando e nenhuma sala precisa' },
  obs: { ic: 'note', sub: 'Anotado por quem conferiu' }
};
// Linha de movimento: de → para (null = depósito)
function linhaMov(de, para, qtd, tipoId, feito, k){
  const lado = id => id === null ? `<span class="cod dep">${ic('box', 'sm')}Depósito</span>` : `<span class="cod lt">${esc(codigo(id))}</span>`;
  return `<div class="tb-l mvl k-${k}${feito ? ' feito' : ''}"><span class="mv">${lado(de)} ${ic('arrow', 'seta')} ${lado(para)} <span class="mv-i"><span class="q">${qtd}</span> ${esc(nomeTipo(tipoId))}</span></span>${feito ? `<span class="ok-tag">${ic('check', 'sm')}</span>` : ''}</div>`;
}
// Cartão de um tipo de ação
const cartaoAcao = (k, titulo, n, rotN, corpo) => `<section class="act k-${k}">
  <div class="act-h"><span class="act-ic">${ic(ACAO[k].ic)}</span><span class="grow act-t"><b>${titulo}</b><span>${ACAO[k].sub}</span></span>${n !== null ? `<span class="act-ct">${n}<small>${rotN}</small></span>` : ''}</div>
  <div class="act-b">${corpo}</div>
</section>`;
function proximaPendente(r, depoisDe){
  const l = S.catalogo.salas, regs = r.salas || {};
  const i0 = depoisDe ? l.findIndex(s => s.id === depoisDe) : -1;
  for (let k = 1; k <= l.length; k++) {
    const s = l[(i0 + k) % l.length];
    if (s.id !== depoisDe && !(regs[s.id] && regs[s.id].conferidaEm)) return s;
  }
  return null;
}
const pendentes = r => S.catalogo.salas.filter(s => !((r.salas || {})[s.id] && r.salas[s.id].conferidaEm)).map(s => s.codigo);
function avisoPendentes(r){
  const pend = pendentes(r);
  return pend.length ? `<div class="notice">${ic('clock')}<span>Ainda falta conferir: <b>${pend.map(esc).join(', ')}</b>. A lista pode mudar.</span></div>` : '';
}

function viewLista(){
  const lista = Object.values(S.rearmes).sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  const novo = S.novo ? `<form class="panel pad" id="f-novo" style="display:flex;flex-direction:column;gap:12px">
      <h2>Nova checagem</h2>
      <div class="row">
        <label class="fld">Evento<input type="text" id="novo-nome" placeholder="Ex: Mariah Carey" maxlength="120" required></label>
        <label class="fld" style="flex:0 1 180px">Data do evento<input type="date" id="novo-data"></label>
      </div>
      <div class="row"><button class="btn pri" type="submit" style="flex:2 1 160px">${ic('check')}Criar checagem</button><button class="btn" type="button" data-a="cancelar-novo" style="flex:1 1 100px">Cancelar</button></div>
    </form>` : '';
  const itens = lista.map(r => {
    const c = resumo(r);
    const tag = c.pendente === 0 && c.total ? (c.divergente ? `<span class="chip no">Falta arrumar</span>` : `<span class="chip ok">${ic('check', 'sm')}Concluída</span>`) : `<span class="chip">Em conferência</span>`;
    return `<button class="lst-i" data-a="abrir-rearme" data-id="${esc(r.id)}">
      ${anel(c)}
      <span class="lst-b">
        <span class="lst-t">${esc(r.nome)}</span>
        <span class="lst-m">${ic('cal', 'sm')}${r.data ? fmtData(r.data) : 'Sem data'}</span>
        <span class="row" style="gap:6px">${tag}${c.divergente ? `<span class="chip no">${c.divergente} com diferença</span>` : ''}${c.rearmada ? `<span class="chip ok">${c.rearmada} em ordem</span>` : ''}</span>
      </span>
      <span class="lst-go">${ic('chev', 'lg')}</span>
    </button>`;
  }).join('');
  return `<div class="row"><h1 class="grow">Checagens</h1></div>
    <p class="muted">Depois de cada evento, confira as salas. O sistema compara com o previsto e monta o que buscar, trocar e devolver.</p>
    ${pode('equipe') && !S.novo ? `<button class="btn pri big" data-a="novo">${ic('plus')}Nova checagem</button>` : ''}
    ${novo}
    <section class="panel">${itens ? `<div class="lst">${itens}</div>` : `<div class="empty">${ic('sofa')}Nenhuma checagem ainda.${pode('equipe') ? '<br>Toque em "Nova checagem" depois do evento.' : ''}</div>`}</section>`;
}

function salaTile(s, reg){
  const st = statusSala(s, reg);
  let rodape = '';
  if (st === 'divergente') {
    const difs = diferencas(previsto(s), reg.contagem);
    const f = difs.filter(d => d.dif < 0).reduce((a, d) => a - d.dif, 0), so = difs.filter(d => d.dif > 0).reduce((a, d) => a + d.dif, 0);
    rodape = `${f ? `<span class="falta">−${f}</span>` : ''}${so ? `<span class="sobra">+${so}</span>` : ''}`;
  } else if (st === 'ok') rodape = `${ic('check', 'sm')}OK`;
  else if (st === 'rearmada') rodape = `${ic('check', 'sm')}Em ordem`;
  else rodape = 'A conferir';
  return `<button class="sala st-${st}" data-a="abrir-sala" data-id="${esc(s.id)}" title="${esc(s.nome)} · ${ROT_ST[st]}"><b>${esc(s.codigo)}</b><small>${rodape}</small></button>`;
}

function htmlSalasRearme(r){
  const regs = r.salas || {}, f = S.filtro;
  let h = '';
  blocos().forEach(b => {
    const salas = b.salas.filter(s => !f || statusSala(s, regs[s.id]) === f);
    if (!salas.length) return;
    const conf = b.salas.filter(s => regs[s.id] && regs[s.id].conferidaEm).length;
    h += `<div class="gr"><div class="gr-h"><span class="grow">${ic(iconeBloco(b.grupo), 'sm')}${esc(b.nome)}</span><span>${conf}/${b.salas.length}</span><span class="mini"><i style="width:${b.salas.length ? conf / b.salas.length * 100 : 0}%"></i></span></div>
      <div class="mapa">${salas.map(s => salaTile(s, regs[s.id])).join('')}</div></div>`;
  });
  const filtro = f ? `<div class="row"><span class="chip">Mostrando: <b>${ROT_ST[f]}</b></span><button class="btn sm" data-a="filtro" data-f="${f}">${ic('x', 'sm')}Mostrar todas</button></div>` : '';
  return filtro + (h ? `<section class="panel pad">${h}
    <div class="legenda" style="margin-top:14px"><span><i style="border:1px dashed var(--ghost)"></i>A conferir</span><span><i style="background:var(--no-bg);border:1px solid rgba(225,21,24,.4)"></i>Diferença</span><span><i style="background:var(--ok-bg)"></i>Sem diferença</span><span><i style="background:var(--ok)"></i>Em ordem</span></div>
  </section>` : `<div class="panel empty">Nenhuma sala neste filtro.</div>`);
}

function htmlCruzamento(r, c, plano){
  if (!c.conferidas) return `<div class="panel empty">${ic('shuffle')}O cruzamento aparece quando as primeiras salas forem conferidas.</div>`;
  const regs = r.salas || {};
  const rearmada = id => !!(regs[id] && regs[id].rearmadaEm);
  const soma = l => l.reduce((a, x) => a + x.qtd, 0);
  let t = '';
  blocos().forEach(b => {
    const conferidas = b.salas.filter(s => regs[s.id] && regs[s.id].conferidaEm);
    const comDif = conferidas.filter(s => plano.porSala[s.id]);
    const semDif = conferidas.filter(s => !plano.porSala[s.id]);
    const pend = b.salas.filter(s => !(regs[s.id] && regs[s.id].conferidaEm));
    const trocas = plano.remanejar.filter(m => m.bloco !== null && m.bloco === b.grupo);
    const totF = comDif.reduce((a, s) => a + soma(plano.porSala[s.id].faltas), 0);
    const totS = comDif.reduce((a, s) => a + soma(plano.porSala[s.id].sobras), 0);
    t += `<div class="tb-h"><span class="grow">${ic(iconeBloco(b.grupo), 'sm')}${esc(b.nome)} · ${conferidas.length}/${b.salas.length}</span>${totF ? `<span class="dc f">−${totF}</span>` : ''}${totS ? `<span class="dc s">+${totS}</span>` : ''}</div>`;
    t += comDif.map(s => { const d = plano.porSala[s.id]; return `<div class="tb-l cz-l${rearmada(s.id) ? ' feito' : ''}">
        <button class="cod" data-a="abrir-sala" data-id="${esc(s.id)}">${esc(s.codigo)}</button>
        <span class="dcs grow">${d.faltas.map(x => chipDif({ tipoId: x.tipoId, dif: -x.qtd })).join('')}${d.sobras.map(x => chipDif({ tipoId: x.tipoId, dif: x.qtd })).join('')}</span>
        ${rearmada(s.id) ? `<span class="ok-tag">${ic('check', 'sm')}Em ordem</span>` : pode('equipe') ? `<button class="ico" data-a="marcar-sala" data-id="${esc(s.id)}" title="Marcar ${esc(s.codigo)} em ordem" aria-label="Marcar ${esc(s.codigo)} em ordem">${ic('check')}</button>` : ''}
      </div>`; }).join('');
    const notas = [];
    if (semDif.length) notas.push(`<span class="ok-tag">${ic('check', 'sm')}Sem diferença</span> ${semDif.map(s => esc(s.codigo)).join(', ')}`);
    if (pend.length) notas.push(`${ic('clock', 'sm')} A conferir: ${pend.map(s => esc(s.codigo)).join(', ')}`);
    if (notas.length) t += `<div class="tb-n">${notas.join('<span style="color:var(--ghost)">|</span>')}</div>`;
    if (comDif.length) t += trocas.length
      ? `<div class="tb-n">${ic('swap', 'sm')} Trocas entre ${esc(b.nome.toLowerCase())}</div>${trocas.map(m => linhaMov(m.de, m.para, m.qtd, m.tipoId, rearmada(m.de) && rearmada(m.para), 'bloco')).join('')}`
      : `<div class="tb-n">${ic('swap', 'sm')} Nenhuma troca dentro do bloco: o que falta numa sala não sobra em outra.</div>`;
  });
  const entre = plano.remanejar.filter(m => m.bloco === null);
  if (entre.length) t += `<div class="tb-h"><span class="grow">${ic('shuffle', 'sm')}Entre camarins e produção · mais longe</span></div>${entre.map(m => linhaMov(m.de, m.para, m.qtd, m.tipoId, rearmada(m.de) && rearmada(m.para), 'entre')).join('')}`;
  return `${avisoPendentes(r)}<section class="panel tb">${t}</section>
    <button class="btn pri big" data-a="aba" data-aba="lista">${ic('list')}Ver o que fazer</button>`;
}

function htmlLista(r, c, plano){
  if (!c.conferidas) return `<div class="panel empty">${ic('list')}A lista aparece aqui conforme as salas forem conferidas.</div>`;
  const regs = r.salas || {};
  const rearmada = id => !!(regs[id] && regs[id].rearmadaEm);
  const soma = l => l.reduce((a, x) => a + x.qtd, 0);
  const pc = n => n === 1 ? 'peça' : 'peças';
  const cards = [];
  if (!plano.buscar.length && !plano.remanejar.length && !plano.devolver.length) {
    cards.push(`<div class="panel empty">${ic('checkc')}As salas conferidas estão iguais ao previsto. Nada a arrumar.</div>`);
  } else {
    blocos().forEach(b => {
      const l = plano.remanejar.filter(m => m.bloco !== null && m.bloco === b.grupo);
      if (l.length) cards.push(cartaoAcao('bloco', 'Trocas entre ' + esc(b.nome.toLowerCase()), soma(l), pc(soma(l)),
        l.map(m => linhaMov(m.de, m.para, m.qtd, m.tipoId, rearmada(m.de) && rearmada(m.para), 'bloco')).join('')));
    });
    const entre = plano.remanejar.filter(m => m.bloco === null);
    if (entre.length) cards.push(cartaoAcao('entre', 'Entre camarins e produção', soma(entre), pc(soma(entre)),
      entre.map(m => linhaMov(m.de, m.para, m.qtd, m.tipoId, rearmada(m.de) && rearmada(m.para), 'entre')).join('')));
    if (plano.buscar.length) cards.push(cartaoAcao('buscar', 'Buscar no depósito', soma(plano.buscar), pc(soma(plano.buscar)),
      plano.buscar.map(m => linhaMov(null, m.para, m.qtd, m.tipoId, rearmada(m.para), 'buscar')).join('')));
    if (plano.devolver.length) cards.push(cartaoAcao('levar', 'Levar ao depósito', soma(plano.devolver), pc(soma(plano.devolver)),
      plano.devolver.map(m => linhaMov(m.de, null, m.qtd, m.tipoId, rearmada(m.de), 'levar')).join('')));
  }
  const obs = S.catalogo.salas.filter(s => regs[s.id] && regs[s.id].obs);
  if (obs.length) cards.push(cartaoAcao('obs', 'Observações', obs.length, obs.length === 1 ? 'nota' : 'notas',
    obs.map(s => `<div class="tb-l"><span class="cod lt">${esc(s.codigo)}</span><span class="grow">${esc(regs[s.id].obs)}</span></div>`).join('')));
  return `${avisoPendentes(r)}<div class="acts">${cards.join('')}</div>`;
}

// Folha impressa: mesma cor e marca do sistema
function htmlImpressao(r, c, plano){
  const regs = r.salas || {};
  const rearmada = id => !!(regs[id] && regs[id].rearmadaEm);
  const agora = new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const linhas = [];
  if (plano) {
    blocos().forEach(b => plano.remanejar.filter(m => m.bloco !== null && m.bloco === b.grupo).forEach(m => linhas.push(['Troca · ' + b.nome.toLowerCase(), codigo(m.de), codigo(m.para), m, rearmada(m.de) && rearmada(m.para), 'bloco'])));
    plano.remanejar.filter(m => m.bloco === null).forEach(m => linhas.push(['Entre blocos', codigo(m.de), codigo(m.para), m, rearmada(m.de) && rearmada(m.para), 'entre']));
    plano.buscar.forEach(m => linhas.push(['Buscar no depósito', 'Depósito', codigo(m.para), m, rearmada(m.para), 'buscar']));
    plano.devolver.forEach(m => linhas.push(['Levar ao depósito', codigo(m.de), 'Depósito', m, rearmada(m.de), 'levar']));
  }
  const fazer = linhas.length
    ? `<table><tr><th class="ck"></th><th>O quê</th><th>Item</th><th>De</th><th>Para</th></tr>${linhas.map(([o, de, para, m, f, k]) => `<tr class="${f ? 'feito' : ''}"><td class="ck"><i></i></td><td class="k-${k}"><span class="kd"></span>${esc(o)}</td><td><b>${m.qtd}</b> ${esc(nomeTipo(m.tipoId))}</td><td class="c">${esc(de)}</td><td class="c">${esc(para)}</td></tr>`).join('')}</table>`
    : `<table><tr><td>${c.conferidas ? 'As salas conferidas estão iguais ao previsto.' : 'Nenhuma sala conferida ainda.'}</td></tr></table>`;
  const salas = S.catalogo.salas.map(s => {
    const reg = regs[s.id], st = statusSala(s, reg), d = plano && plano.porSala[s.id];
    const txt = (l, cls) => l && l.length ? `<span class="${cls}">${l.map(x => `${x.qtd} ${esc(nomeTipo(x.tipoId))}`).join(', ')}</span>` : '—';
    return `<tr><td class="c">${esc(s.codigo)}</td><td>${esc(nomeBloco(s.grupo))}</td><td>${txt(d && d.faltas, 'falta')}</td><td>${txt(d && d.sobras, 'sobra')}</td><td>${ROT_ST[st]}${reg && reg.conferidaPor ? ` · ${esc(reg.conferidaPor)}` : ''}</td></tr>`;
  }).join('');
  const obs = S.catalogo.salas.filter(s => regs[s.id] && regs[s.id].obs);
  const st = (n, rot, cor) => `<div><b style="color:${cor}">${n}</b><span>${rot}</span></div>`;
  return `<section class="imp">
    <div class="imp-band"><img src="logo_gl.png" alt=""><div><div class="t">Farmasi Arena</div><span class="s">Salas em ordem</span></div>
      <div class="ev"><b>${esc(r.nome)}</b><span>${r.data ? 'Evento ' + fmtData(r.data) + ' · ' : ''}impresso em ${agora}</span></div></div>
    <div class="imp-st">${st(c.pendente, 'A conferir', 'var(--ink)')}${st(c.divergente, 'Com diferença', 'var(--no)')}${st(c.ok, 'Sem diferença', 'var(--ok)')}${st(c.rearmada, 'Em ordem', 'var(--ok)')}</div>
    ${avisoPendentes(r)}
    <div class="imp-sec"><h3>O que fazer<span class="ct">${linhas.length}</span></h3>${fazer}</div>
    <div class="imp-sec"><h3>Cruzamento por sala</h3><table><tr><th>Sala</th><th>Bloco</th><th>Falta</th><th>Sobra</th><th>Situação</th></tr>${salas}</table></div>
    ${obs.length ? `<div class="imp-sec"><h3>Observações</h3><table>${obs.map(s => `<tr><td class="c">${esc(s.codigo)}</td><td>${esc(regs[s.id].obs)}</td></tr>`).join('')}</table></div>` : ''}
    <div class="imp-pe"><span>Salas em Ordem · Farmasi Arena · GL events</span><span>${agora}</span></div>
  </section>`;
}

function viewRearme(){
  const r = S.rearmes[S.rearmeId];
  const c = resumo(r);
  const plano = c.conferidas ? planoDe(r) : null;
  const nTarefas = plano ? plano.buscar.length + plano.remanejar.length + plano.devolver.length : 0;
  const prox = proximaPendente(r);
  const aba = S.aba || 'salas';
  const tile = (st, n, rot, cls) => `<button class="tile ${cls}" data-a="filtro" data-f="${st}" aria-pressed="${S.filtro === st}"><b>${n}</b><span>${rot}</span></button>`;
  const tab = (id, rot) => `<button role="tab" data-a="aba" data-aba="${id}" aria-selected="${aba === id}">${rot}</button>`;
  const conf = S.confirmar === 'apagar-rearme'
    ? `<div class="notice">${ic('alert')}<span>Apagar a checagem "${esc(r.nome)}" e todas as conferências dela? <button class="btn sm danger" data-a="apagar-rearme-sim">Apagar</button> <button class="btn sm" data-a="cancelar-conf">Cancelar</button></span></div>` : '';
  const corpo = aba === 'cruz' ? htmlCruzamento(r, c, plano) : aba === 'lista' ? htmlLista(r, c, plano) : htmlSalasRearme(r);
  return `<div><button class="link" data-a="go-lista">${ic('back', 'sm')}Checagens</button></div>
    <div class="row"><h1 class="grow">${esc(r.nome)}</h1>${r.data ? `<span class="chip">${ic('cal', 'sm')}${fmtData(r.data)}</span>` : ''}</div>
    <section class="panel resumo">
      ${anel(c, 'g')}
      <div class="tiles">
        ${tile('pendente', c.pendente, 'A conferir', 't-pend')}
        ${tile('divergente', c.divergente, 'Com diferença', 't-no')}
        ${tile('ok', c.ok, 'Sem diferença', 't-ok')}
        ${tile('rearmada', c.rearmada, 'Em ordem', 't-rea')}
      </div>
    </section>
    <div class="acoes"${pode('equipe') ? '' : ' style="grid-template-columns:1fr 1fr"'}>
      ${pode('equipe') ? (prox
        ? `<button class="btn pri duo" data-a="proxima"><span style="display:flex;align-items:center;gap:6px">${ic('play', 'sm')}Conferir</span><small>próxima: ${esc(prox.codigo)}</small></button>`
        : `<button class="btn pri" data-a="proxima" disabled>${ic('check')}Tudo conferido</button>`) : ''}
      <button class="btn" data-a="copiar">${ic('msg')}WhatsApp</button>
      <button class="btn" data-a="imprimir">${ic('printer')}Imprimir</button>
    </div>
    ${S.copia !== null ? `<div class="copybox panel pad" style="display:flex;flex-direction:column;gap:8px"><textarea id="copia" readonly>${esc(S.copia)}</textarea><div class="row"><button class="btn pri" data-a="copiar-de-novo">Copiar</button><button class="btn" data-a="fechar-copia">Fechar</button></div></div>` : ''}
    <div class="seg" role="tablist">
      ${tab('salas', 'Salas')}${tab('cruz', 'Cruzamento')}${tab('lista', `O que fazer${nTarefas ? ` <span class="n">${nTarefas}</span>` : ''}`)}
    </div>
    ${corpo}
    ${pode('admin') ? `<div style="margin-top:8px">${conf || `<button class="btn sm danger" data-a="apagar-rearme">${ic('trash', 'sm')}Apagar esta checagem</button>`}</div>` : ''}
    ${htmlImpressao(r, c, plano)}`;
}

function textoWhatsApp(r){
  const regs = r.salas || {};
  const plano = planoDe(r);
  let t = `*SALAS EM ORDEM*\n${r.nome}${r.data ? ' · ' + fmtData(r.data) : ''}\n`;
  const pend = pendentes(r);
  if (pend.length) t += `Falta conferir: ${pend.join(', ')}\n`;
  const troca = m => `• ${codigo(m.de)} → ${codigo(m.para)}: ${m.qtd} ${nomeTipo(m.tipoId)}`;
  const itensTxt = l => l.map(x => `${x.qtd} ${nomeTipo(x.tipoId)}`).join(', ');
  blocos().forEach(b => {
    const comDif = b.salas.filter(s => plano.porSala[s.id]);
    if (!comDif.length) return;
    const trocas = plano.remanejar.filter(m => m.bloco !== null && m.bloco === b.grupo);
    t += `\n*${b.nome.toUpperCase()}*\n` + comDif.map(s => {
      const d = plano.porSala[s.id];
      return `• ${s.codigo}:` + (d.faltas.length ? ` falta ${itensTxt(d.faltas)}` : '') + (d.faltas.length && d.sobras.length ? ';' : '') + (d.sobras.length ? ` sobra ${itensTxt(d.sobras)}` : '');
    }).join('\n') + '\n';
    if (trocas.length) t += `_Trocas no bloco_\n` + trocas.map(troca).join('\n') + '\n';
  });
  const entre = plano.remanejar.filter(m => m.bloco === null);
  if (entre.length) t += `\n*ENTRE CAMARINS E PRODUÇÃO*\n` + entre.map(troca).join('\n') + '\n';
  if (plano.buscar.length) {
    const g = {}; plano.buscar.forEach(b => (g[b.tipoId] = g[b.tipoId] || []).push(b));
    t += `\n*BUSCAR NO DEPÓSITO*\n` + Object.keys(g).map(k => `• ${g[k].reduce((a, b) => a + b.qtd, 0)} ${nomeTipo(k)} → ${g[k].map(b => `${codigo(b.para)} (${b.qtd})`).join(', ')}`).join('\n') + '\n';
  }
  if (plano.devolver.length) t += `\n*LEVAR AO DEPÓSITO*\n` + plano.devolver.map(d => `• ${d.qtd} ${nomeTipo(d.tipoId)} da ${codigo(d.de)}`).join('\n') + '\n';
  if (!plano.buscar.length && !plano.remanejar.length && !plano.devolver.length) t += `\nSalas conferidas iguais ao previsto.\n`;
  const obs = S.catalogo.salas.filter(s => regs[s.id] && regs[s.id].obs);
  if (obs.length) t += `\n*OBSERVAÇÕES*\n` + obs.map(s => `• ${s.codigo}: ${regs[s.id].obs}`).join('\n') + '\n';
  return t;
}

function viewSala(){
  const r = S.rearmes[S.rearmeId], sala = salaPorId(S.salaId);
  if (!sala) { S.view = 'rearme'; return viewRearme(); }
  const reg = (r.salas || {})[sala.id];
  const so = !pode('equipe');
  const R = S.rasc;
  const idx = S.catalogo.salas.findIndex(s => s.id === sala.id);
  const nDif = R.itens.filter(i => i.qtd !== i.previsto).length;
  const prox = proximaPendente(r, sala.id);
  const linhas = R.itens.map(i => {
    const d = i.qtd - i.previsto;
    const cls = d < 0 ? 'd-falta' : d > 0 ? 'd-sobra' : '';
    const sub = i.previsto === 0 ? 'Não é desta sala' : `Previsto: ${i.previsto}`;
    const difTxt = d < 0 ? ` · <span class="falta">Falta${-d > 1 ? 'm' : ''} ${-d}</span>` : d > 0 ? ` · <span class="sobra">Sobra${d > 1 ? 'm' : ''} ${d}</span>` : ` · <span class="certo">${ic('check', 'sm')}</span>`;
    return `<div class="it ${cls}" data-tipo="${esc(i.tipoId)}">
      <span class="it-n"><b>${esc(nomeTipo(i.tipoId))}</b><span>${sub}${difTxt}</span></span>
      ${so ? `<span class="step"><output>${i.qtd}</output></span>` : `<span class="step"><button data-a="menos" aria-label="Diminuir">${ic('minus')}</button><output>${i.qtd}</output><button data-a="mais" aria-label="Aumentar">${ic('plus')}</button></span>`}
      ${!so && i.previsto === 0 ? `<button class="x" data-a="remover-item" aria-label="Remover">${ic('x')}</button>` : ''}
    </div>`;
  }).join('');
  const naLista = new Set(R.itens.map(i => i.tipoId));
  const opcoes = Object.values(S.catalogo.tipos).filter(t => !naLista.has(t.id)).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const conf = S.confirmar === 'apagar-conf' ? `<div class="notice">${ic('alert')}<span>Apagar a conferência da ${esc(sala.codigo)}? Ela volta para "A conferir". <button class="btn sm danger" data-a="apagar-conf-sim">Apagar</button> <button class="btn sm" data-a="cancelar-conf">Cancelar</button></span></div>` : '';
  return `<div class="row"><button class="link grow" data-a="voltar-rearme">${ic('back', 'sm')}${esc(r.nome)}</button><span class="small muted">Sala ${idx + 1} de ${S.catalogo.salas.length}</span></div>
    <div class="sala-top">
      <span class="bl-ic">${ic(iconeBloco(sala.grupo))}</span>
      <div class="grow"><h1>${esc(sala.codigo)}</h1><span class="muted small">${esc(sala.nome)} · ${esc(nomeBloco(sala.grupo))}</span></div>
      ${nDif ? `<span class="pill no">${nDif} ${plural(nDif, 'diferença', 'diferenças')}</span>` : `<span class="pill ok">${ic('check', 'sm')}Igual ao previsto</span>`}
    </div>
    ${so ? '' : `<p class="muted small">Conte o que está na sala agora. A lista já vem com o previsto: só ajuste o que estiver diferente.</p>
    <button class="btn ok big" data-a="tudo-certo">${ic('check')}Está tudo igual ao previsto</button>`}
    <section class="panel"><div class="itens">${linhas}</div></section>
    ${so ? '' : `<div class="row">
      <select id="add-tipo" class="grow" style="flex:1 1 200px"><option value="">Item a mais na sala…</option>${opcoes.map(t => `<option value="${esc(t.id)}">${esc(t.nome)}</option>`).join('')}</select>
      <button class="btn" data-a="add-item">${ic('plus', 'sm')}Adicionar</button>
    </div>
    <label class="fld" style="flex:none">Quem conferiu<input type="text" id="conferente" maxlength="80" value="${esc(R.conferidaPor)}" autocomplete="name"></label>
    <label class="fld" style="flex:none">Observação (opcional)<textarea id="obs" maxlength="1000" placeholder="Ex: espelho trincado, sofá manchado">${esc(R.obs)}</textarea></label>
    <div class="fixo">
      <button class="btn pri" data-a="salvar-conf">${ic('save')}Salvar</button>
      ${prox ? `<button class="btn ink duo" data-a="salvar-prox"><span style="display:flex;align-items:center;gap:6px">Salvar e próxima ${ic('chev', 'sm')}</span><small>vai para a ${esc(prox.codigo)}</small></button>` : ''}
    </div>`}
    ${reg && reg.conferidaEm ? `<section class="panel pad" style="display:flex;flex-direction:column;gap:10px">
      <span class="small muted" style="display:flex;align-items:center;gap:6px">${ic('user', 'sm')}Conferida por ${esc(reg.conferidaPor)} em ${fmtHora(reg.conferidaEm)}${reg.rearmadaEm ? ` · em ordem desde ${fmtHora(reg.rearmadaEm)}` : ''}</span>
      ${so ? '' : (reg.rearmadaEm
        ? `<button class="btn" data-a="desmarcar">${ic('rotate', 'sm')}Desfazer "em ordem"</button>`
        : `<button class="btn ok" data-a="marcar">${ic('check')}Marcar sala em ordem</button>`)}
      ${so ? '' : (conf || `<button class="btn danger" data-a="apagar-conf">${ic('trash', 'sm')}Apagar a conferência desta sala</button>`)}
    </section>` : ''}`;
}

function viewSalas(){
  const total = S.catalogo.salas.reduce((a, s) => a + s.itens.reduce((b, i) => b + i.qtd, 0), 0);
  const linha = s => `<div class="cat-l">
      <span class="grow"><span class="cat-t"><b>${esc(s.codigo)}</b><span>${esc(s.nome)} · ${pecas(s)}</span></span>
      <span class="dcs">${s.itens.map(i => `<span class="dc n"><b>${i.qtd}</b> ${esc(nomeTipo(i.tipoId))}</span>`).join('')}</span></span>
      ${pode('admin') ? `<button class="ico" data-a="editar-sala" data-id="${esc(s.id)}" title="Editar ${esc(s.codigo)}" aria-label="Editar ${esc(s.codigo)}">${ic('pencil', 'sm')}</button>` : ''}
    </div>`;
  return `<div class="row"><h1 class="grow">Salas</h1></div>
    <p class="muted">O que cada sala deve ter. ${S.catalogo.salas.length} salas, ${total} peças.${S.catalogo.origem ? ` Base: ${esc(S.catalogo.origem)}.` : ''}${pode('admin') ? '' : ' Só o administrador muda o previsto.'}</p>
    ${pode('admin') ? `<button class="btn pri big" data-a="nova-sala">${ic('plus')}Nova sala</button>` : ''}
    ${blocos().map(b => `<section class="panel tb"><div class="tb-h"><span class="grow">${ic(iconeBloco(b.grupo), 'sm')}${esc(b.nome)}</span><span class="ct">${b.salas.length}</span></div>${b.salas.map(linha).join('')}</section>`).join('')}`;
}

function viewSalaEd(){
  const E = S.ed;
  const grupos = [...new Set(S.catalogo.salas.map(s => s.grupo).filter(Boolean))];
  const linhas = E.itens.map(i => `<div class="it" data-tipo="${esc(i.tipoId)}">
      <span class="it-n"><b>${esc(nomeTipo(i.tipoId))}</b></span>
      <span class="step"><button data-a="ed-menos" aria-label="Diminuir">${ic('minus')}</button><output>${i.qtd}</output><button data-a="ed-mais" aria-label="Aumentar">${ic('plus')}</button></span>
      <button class="x" data-a="ed-remover" aria-label="Remover">${ic('x')}</button>
    </div>`).join('');
  const conf = S.confirmar === 'apagar-sala' ? `<div class="notice">${ic('alert')}<span>Tirar a ${esc(E.codigo)} do sistema? Ela some de todas as checagens. <button class="btn sm danger" data-a="apagar-sala-sim">Tirar</button> <button class="btn sm" data-a="cancelar-conf">Cancelar</button></span></div>` : '';
  return `<div><button class="link" data-a="go-salas">${ic('back', 'sm')}Salas</button></div>
    <h1>${E.nova ? 'Nova sala' : 'Editar ' + esc(E.codigo)}</h1>
    <p class="muted">Isto muda o que a sala deve ter em todas as checagens, inclusive nas que estão abertas.</p>
    <div class="row">
      <label class="fld" style="flex:0 1 140px">Código<input type="text" id="ed-codigo" maxlength="20" value="${esc(E.codigo)}" placeholder="C-07"></label>
      <label class="fld">Nome<input type="text" id="ed-nome" maxlength="80" value="${esc(E.nome)}" placeholder="Camarim 07"></label>
    </div>
    <div class="fld" style="flex:none">Bloco<div class="seg">${['', ...grupos].map(g => `<button type="button" data-a="ed-grupo" data-g="${esc(g)}" aria-selected="${(E.grupo || '') === g}">${g ? ic(iconeBloco(g), 'sm') + esc(nomeBloco(g)) : 'Pela letra'}</button>`).join('')}</div></div>
    <section class="panel"><div class="itens">${linhas || `<div class="empty">Nenhum item ainda.</div>`}</div></section>
    <div class="row">
      <input type="text" id="ed-add" list="tipos" placeholder="Item (ex: Banqueta)" maxlength="80" style="flex:1 1 200px">
      <datalist id="tipos">${Object.values(S.catalogo.tipos).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(t => `<option value="${esc(t.nome)}">`).join('')}</datalist>
      <button class="btn" data-a="ed-add">${ic('plus', 'sm')}Adicionar</button>
    </div>
    <div class="row"><button class="btn pri" data-a="ed-salvar" style="flex:2 1 200px">${ic('save')}Salvar</button><button class="btn" data-a="go-salas" style="flex:1 1 120px">Cancelar</button></div>
    ${E.nova ? '' : (conf || `<div><button class="btn sm danger" data-a="apagar-sala">${ic('trash', 'sm')}Tirar esta sala do sistema</button></div>`)}`;
}

// ---------- ações ----------
function abrirSala(id){
  const r = S.rearmes[S.rearmeId], sala = salaPorId(id);
  const reg = (r.salas || {})[id];
  const itens = sala.itens.map(i => ({ tipoId: i.tipoId, previsto: i.qtd, qtd: reg && reg.contagem && reg.contagem[i.tipoId] !== undefined ? reg.contagem[i.tipoId] : i.qtd }));
  if (reg && reg.contagem) Object.keys(reg.contagem).forEach(t => { if (!itens.some(i => i.tipoId === t)) itens.push({ tipoId: t, previsto: 0, qtd: reg.contagem[t] }); });
  let nome = ''; try { nome = localStorage.getItem('rearme_conferente') || ''; } catch (_) {}
  S.rasc = { itens, conferidaPor: (reg && reg.conferidaPor) || nome, obs: (reg && reg.obs) || '' };
  S.salaId = id; S.view = 'sala'; S.confirmar = null;
  render(); window.scrollTo(0, 0);
}
function lerCampos(){
  const c = document.getElementById('conferente'), o = document.getElementById('obs');
  if (S.rasc && c) S.rasc.conferidaPor = c.value;
  if (S.rasc && o) S.rasc.obs = o.value;
  const ec = document.getElementById('ed-codigo'), en = document.getElementById('ed-nome');
  if (S.ed && ec) S.ed.codigo = ec.value;
  if (S.ed && en) S.ed.nome = en.value;
}
const urlSala = () => `api/rearmes/${encodeURIComponent(S.rearmeId)}/salas/${encodeURIComponent(S.salaId)}`;

function salvarCatalogo(novo, msg){
  return gravar('PUT', 'api/catalogo', novo).then(() => { S.catalogo = novo; S.ed = null; S.view = 'salas'; render(); toast(msg); }, e => toast(e.msg));
}

app.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'f-senha') {
    api('POST', 'api/entrar', { senha: document.getElementById('senha').value })
      .then(() => { S.pedirSenha = false; iniciar(); }, e => toast(e.status === 401 ? 'Senha errada' : e.msg));
  }
  if (ev.target.id === 'f-novo') {
    const nome = document.getElementById('novo-nome').value.trim(), data = document.getElementById('novo-data').value;
    if (!nome) return toast('Informe o nome do evento');
    gravar('POST', 'api/rearmes', { nome, data }).then(d => { S.novo = false; S.rearmeId = d.id; S.view = 'rearme'; S.rearmes[d.id] = { id: d.id, nome, data, criadoEm: Date.now(), salas: {} }; render(); }, e => toast(e.msg));
  }
});

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  lerCampos();
  const a = b.dataset.a;
  const R = S.rasc, E = S.ed;
  const linha = b.closest('[data-tipo]');
  const tipo = linha && linha.dataset.tipo;
  switch (a) {
    case 'go-lista': S.view = 'lista'; S.copia = null; S.confirmar = null; break;
    case 'go-salas': S.view = 'salas'; S.ed = null; S.confirmar = null; break;
    case 'novo': S.novo = true; render(); document.getElementById('novo-nome').focus(); return;
    case 'cancelar-novo': S.novo = false; break;
    case 'abrir-rearme': S.rearmeId = b.dataset.id; S.view = 'rearme'; S.aba = 'salas'; S.filtro = null; S.copia = null; S.confirmar = null; render(); window.scrollTo(0, 0); return;
    case 'aba': S.aba = b.dataset.aba; break;
    case 'filtro': S.filtro = S.filtro === b.dataset.f ? null : b.dataset.f; S.aba = 'salas'; break;
    case 'proxima': { const p = proximaPendente(S.rearmes[S.rearmeId]); if (p) return abrirSala(p.id); return toast('Todas as salas já foram conferidas'); }
    case 'marcar-sala': {
      const id = b.dataset.id, reg = clone(S.rearmes[S.rearmeId].salas[id]);
      reg.rearmadaEm = new Date().toISOString();
      S.rearmes[S.rearmeId].salas[id] = reg;
      gravar('PUT', `api/rearmes/${encodeURIComponent(S.rearmeId)}/salas/${encodeURIComponent(id)}`, reg).then(() => toast(`${codigo(id)} em ordem!`), e => toast(e.msg));
      break;
    }
    case 'ed-grupo': E.grupo = b.dataset.g; break;
    case 'voltar-rearme': S.view = 'rearme'; S.rasc = null; S.confirmar = null; break;
    case 'abrir-sala': return abrirSala(b.dataset.id);
    case 'menos': { const i = R.itens.find(x => x.tipoId === tipo); i.qtd = Math.max(0, i.qtd - 1); break; }
    case 'mais': { const i = R.itens.find(x => x.tipoId === tipo); i.qtd = Math.min(999, i.qtd + 1); break; }
    case 'remover-item': R.itens = R.itens.filter(x => x.tipoId !== tipo); break;
    case 'tudo-certo': R.itens = R.itens.filter(x => x.previsto > 0); R.itens.forEach(x => { x.qtd = x.previsto; }); break;
    case 'add-item': {
      const t = document.getElementById('add-tipo').value;
      if (!t) return toast('Escolha o item na lista');
      R.itens.push({ tipoId: t, previsto: 0, qtd: 1 }); break;
    }
    case 'salvar-conf': case 'salvar-prox': {
      const quem = (R.conferidaPor || '').trim();
      if (!quem) { toast('Informe quem conferiu'); document.getElementById('conferente').focus(); return; }
      try { localStorage.setItem('rearme_conferente', quem); } catch (_) {}
      const contagem = {};
      R.itens.forEach(i => { if (i.previsto > 0 || i.qtd > 0) contagem[i.tipoId] = i.qtd; });
      const ant = (S.rearmes[S.rearmeId].salas || {})[S.salaId];
      const sala = salaPorId(S.salaId);
      const iguais = diferencas(previsto(sala), contagem).length === 0;
      const reg = { contagem, obs: (R.obs || '').trim(), conferidaPor: quem, conferidaEm: new Date().toISOString() };
      // conferir de novo uma sala já rearmada mantém a marcação só se continuar tudo certo
      if (ant && ant.rearmadaEm && iguais) reg.rearmadaEm = ant.rearmadaEm;
      const rr = S.rearmes[S.rearmeId]; rr.salas = rr.salas || {}; rr.salas[S.salaId] = reg;
      gravar('PUT', urlSala(), reg).then(() => toast(iguais ? `${sala.codigo}: tudo certo!` : `${sala.codigo} salva. Diferenças no cruzamento.`), e => toast(e.msg));
      const prox = a === 'salvar-prox' && proximaPendente(rr, S.salaId);
      if (prox) return abrirSala(prox.id);
      S.view = 'rearme'; S.rasc = null; render(); window.scrollTo(0, 0); return;
    }
    case 'marcar': case 'desmarcar': {
      const reg = clone(S.rearmes[S.rearmeId].salas[S.salaId]);
      if (a === 'marcar') reg.rearmadaEm = new Date().toISOString(); else delete reg.rearmadaEm;
      S.rearmes[S.rearmeId].salas[S.salaId] = reg;
      gravar('PUT', urlSala(), reg).then(() => toast(a === 'marcar' ? `${codigo(S.salaId)} em ordem!` : 'Marcação desfeita'), e => toast(e.msg));
      if (a === 'marcar') { S.view = 'rearme'; S.rasc = null; }
      break;
    }
    case 'apagar-conf': S.confirmar = 'apagar-conf'; break;
    case 'apagar-conf-sim':
      delete S.rearmes[S.rearmeId].salas[S.salaId];
      gravar('DELETE', urlSala()).catch(e => toast(e.msg));
      S.view = 'rearme'; S.rasc = null; S.confirmar = null; break;
    case 'cancelar-conf': S.confirmar = null; break;
    case 'apagar-rearme': S.confirmar = 'apagar-rearme'; break;
    case 'apagar-rearme-sim': {
      const id = S.rearmeId; delete S.rearmes[id];
      gravar('DELETE', 'api/rearmes/' + encodeURIComponent(id)).then(() => toast('Checagem apagada'), e => toast(e.msg));
      S.view = 'lista'; S.confirmar = null; break;
    }
    case 'copiar': {
      const txt = textoWhatsApp(S.rearmes[S.rearmeId]);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => toast('Lista copiada! É só colar no WhatsApp.'), () => { S.copia = txt; render(); });
        return;
      }
      S.copia = txt; break;
    }
    case 'copiar-de-novo': { const t = document.getElementById('copia'); t.select(); try { document.execCommand('copy'); toast('Copiado!'); } catch (_) { toast('Selecione o texto e copie'); } return; }
    case 'fechar-copia': S.copia = null; break;
    case 'imprimir': S.aba = 'lista'; render(); window.print(); return;
    // edição do previsto
    case 'editar-sala': { const s = salaPorId(b.dataset.id); S.ed = { ...clone(s), nova: false }; S.view = 'salaEd'; S.confirmar = null; render(); window.scrollTo(0, 0); return; }
    case 'nova-sala': S.ed = { id: '', codigo: '', nome: '', grupo: '', itens: [], nova: true }; S.view = 'salaEd'; S.confirmar = null; render(); window.scrollTo(0, 0); return;
    case 'ed-menos': { const i = E.itens.find(x => x.tipoId === tipo); i.qtd = Math.max(1, i.qtd - 1); break; }
    case 'ed-mais': { const i = E.itens.find(x => x.tipoId === tipo); i.qtd = Math.min(999, i.qtd + 1); break; }
    case 'ed-remover': E.itens = E.itens.filter(x => x.tipoId !== tipo); break;
    case 'ed-add': {
      const nome = document.getElementById('ed-add').value.trim();
      if (!nome) return toast('Escreva o nome do item');
      let t = Object.values(S.catalogo.tipos).find(x => slug(x.nome) === slug(nome));
      if (!t) {
        // item novo: entra na lista da arena quando a sala for salva
        const id = slug(nome);
        if (!id) return toast('Nome inválido');
        t = { id, nome };
        E.novosTipos = E.novosTipos || {}; E.novosTipos[id] = t;
        S.catalogo.tipos = { ...S.catalogo.tipos, [id]: t };
      }
      if (E.itens.some(x => x.tipoId === t.id)) return toast('Esse item já está na lista');
      E.itens.push({ tipoId: t.id, qtd: 1 }); break;
    }
    case 'ed-salvar': {
      const cod = (E.codigo || '').trim(), nome = (E.nome || '').trim();
      if (!cod || !nome) return toast('Preencha o código e o nome da sala');
      if (!E.itens.length) return toast('Adicione pelo menos um item');
      const novo = clone(S.catalogo);
      novo.tipos = { ...novo.tipos, ...(E.novosTipos || {}) };
      const id = E.nova ? slug(cod) : E.id;
      if (!id) return toast('Código inválido');
      if (E.nova && novo.salas.some(s => s.id === id)) return toast('Já existe uma sala com esse código');
      // Sem bloco escolhido: usa o bloco das outras salas com a mesma letra (C → Camarim, T → Produção).
      const grupo = E.grupo || ((novo.salas.find(s => s.id !== id && s.grupo && s.codigo[0].toUpperCase() === cod[0].toUpperCase()) || {}).grupo) || '';
      const sala = { id, codigo: cod, nome, grupo, itens: E.itens.map(i => ({ tipoId: i.tipoId, qtd: i.qtd })) };
      if (E.nova) novo.salas.push(sala); else novo.salas = novo.salas.map(s => s.id === id ? sala : s);
      salvarCatalogo(novo, E.nova ? `${cod} criada` : `${cod} atualizada`); return;
    }
    case 'apagar-sala': S.confirmar = 'apagar-sala'; break;
    case 'apagar-sala-sim': {
      const novo = clone(S.catalogo); novo.salas = novo.salas.filter(s => s.id !== E.id);
      S.confirmar = null; salvarCatalogo(novo, `${E.codigo} retirada`); return;
    }
    default: return;
  }
  render();
});

render();
iniciar();
})();
</script>
